/* ---- frame builder (writing) ---- */
function frameHTML(F,store,pre){
  return F.parts.map((p,i)=>`<div class="fp"><div class="fph"><b>${p.h}</b>${p.t?` <span class="tag">${p.t}</span>`:''}</div><div class="muted">${p.tip}</div>
  <div class="chipsrow">${p.chips.map((c,j)=>`<button class="phr" data-pre="${pre}" data-i="${i}" data-j="${j}">${esc(c)}</button>`).join('')}</div>
  <textarea id="${pre}${i}" data-k="${i}" placeholder="${pre==='w'?'Write your sentences…':'Write key words / sentences for this part…'}">${esc(store[i]||'')}</textarea></div>`).join('');
}
function bindFrame(F,store,pre,after){
  bindVal(`textarea[id^=${pre}][data-k]`,store);
  document.querySelectorAll(`.phr[data-pre="${pre}"]`).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,t=F.parts[i].chips[+b.dataset.j].replace(/ \/ .*$/,''),ta=$('#'+pre+i);
    ta.value=(ta.value.trim()?ta.value.replace(/\s*$/,' '):'')+t+' ';store[i]=ta.value;save();ta.focus();topbar();after&&after()});
  document.querySelectorAll(`textarea[id^=${pre}]`).forEach(t=>t.addEventListener('input',()=>after&&after()));
}

const markLinks=s=>esc(s).replace(/\[\[(\w+)\|([^\]]*)\]\]/g,'<mark class="lk lk-$1" title="Linking word">$2</mark>').replace(/\n/g,'<br><br>');
function rSpk(){
  const slides=MODEL_PARTS.map((p,i)=>{
    const links=[...p.script.matchAll(/\[\[(\w+)\|([^\]]*)\]\]/g)].map(m=>[m[1],m[2]]);
    const seen=new Set(),uniq=links.filter(l=>{const k=l[1].toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
    return `<div class="slide"><div class="sh"><span class="sn">${i+1}</span><b>${p.h}</b><span class="tag">${p.t}</span></div>
    <div class="coreline">💡 ${p.core}</div>
    <div class="script">${markLinks(p.script)}</div>
    <div class="sn2"><b>Vì sao viết vậy:</b> ${p.why}</div><div class="sn2"><b>Mẹo nói:</b> ${p.tip}</div>
    <div class="lkl"><b>Linking words:</b> ${uniq.map(l=>`<span class="lkx lk-${l[0]}">${esc(l[1])}</span>`).join(' ')}</div>
    <div class="row"><button data-lp="${i}">🔊 Listen</button><button data-ls="${i}">🐢 Slowly</button><button data-vi="${i}">🇻🇳 Tóm tắt</button></div><div class="viz" id="vz${i}" hidden>${esc(p.vi)}</div></div>`}).join('');
  $('#main').innerHTML=`<div class="ctxred"><div class="ctxh">${CONTEXT.title}</div><p>${CONTEXT.body}</p><p>${CONTEXT.why}</p></div>
  <div class="card"><h2>Share it like a talk</h2><p>${esc(SFRAME.task)}</p>
  <div class="flow">${CONTEXT.flow.map((f,i)=>`<span><b>${i+1}</b> ${f}</span>`).join('')}</div>
  <div class="talkmap">${SFRAME.parts.map((p,i)=>`<span>${p.h.slice(4)}</span>${i<3?'<i>→</i>':''}`).join('')}</div>
  <div class="coregrid">${CORE.map(c=>`<div class="corebox"><div class="ci">${c[0]}</div><b>${c[1]}</b><div class="muted">${c[2]}</div></div>`).join('')}</div></div>
  <div class="card"><h2>A · Listen to the model talk</h2><p class="muted">Bài chia sẻ mẫu khoảng 2 phút, từ vựng A2–B1. Các từ nối được tô màu. Nghe từng phần và chú ý cách chúng dẫn người nghe đi từ ý này sang ý khác.</p>
  <div class="legend">${Object.entries(LK_TYPES).map(([k,v])=>`<span class="lkx lk-${k}">${v}</span>`).join('')}</div>
  <div class="row" style="margin-bottom:8px"><button class="pri" id="pm">🔊 Listen to the whole talk</button><button id="pm2">🐢 Slowly</button></div>${slides}</div>
  <div class="card"><h2>Want to learn more?</h2><p class="muted">Nguồn thông tin về câu chuyện Starbucks. Các nguồn có thể khác nhau ở vài chi tiết (ví dụ số quán cà phê ở Milan, hoặc việc năm 1987 Schultz “gia nhập” hay “mua lại” Starbucks), nên hãy đọc thêm để tự kiểm chứng.</p>
  <ul class="src">${SOURCES.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a><div class="muted">${esc(s[2])}</div></li>`).join('')}</ul></div>
  <div class="card"><h2>B · Use this structure at work</h2><p class="muted">Cùng bộ khung này dùng cho nhiều tình huống thật. Chỉ cần thay nội dung.</p>
  <table class="reuse">${REUSE.map(r=>`<tr><th>${r[0]}</th><td><i>${esc(r[1])}</i><div class="muted">${esc(r[2])}</div></td></tr>`).join('')}</table></div>
  <div class="card"><h2>C · Record your talk</h2><p class="muted">Đọc bài mẫu hoặc nói lại theo cách của em, từ Hook đến Conclusion. Nhớ dùng ít nhất 4 từ nối. Ghi âm bao nhiêu lần cũng được; bản cuối cùng sẽ được nộp ở bước 6.</p>
  <div class="row"><button class="pri" id="rb">🎙 Start recording</button><button id="rs" disabled>⏹ Stop</button><span id="rst" class="muted"></span></div><div id="rp" style="margin-top:10px"></div></div>${nav('wri','sub')}`;
  document.querySelectorAll('[data-lp]').forEach(b=>b.onclick=()=>say(stripM(MODEL_PARTS[+b.dataset.lp].script).replace(/\n/g,' '),.85));
  document.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>say(stripM(MODEL_PARTS[+b.dataset.ls].script).replace(/\n/g,' '),.6));
  document.querySelectorAll('[data-vi]').forEach(b=>b.onclick=()=>{const e=$('#vz'+b.dataset.vi);e.hidden=!e.hidden});
  $('#pm').onclick=()=>say(MODEL_TALK,.85);$('#pm2').onclick=()=>say(MODEL_TALK,.6);
  $('#rb').onclick=startRec;$('#rs').onclick=stopRec;bindNav('wri','sub');
  if(R.blob)showRec();else if(S.audioSent)$('#rp').innerHTML='<div class="fb">Em đã nộp một bản ghi âm trước đó. Ghi lại nếu muốn thay bằng bản mới.</div>';
}
async function startRec(){
  if(R.live||R.busy)return;R.busy=true;
  try{
    try{speechSynthesis.cancel()}catch(e){}
    R.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    R.chunks=[];R.tr='';R.blob=null;R.uploaded=false;if(R.url){URL.revokeObjectURL(R.url);R.url=null}
    const mr=new MediaRecorder(R.stream);R.mr=mr;
    mr.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
    mr.onstop=()=>{R.stream.getTracks().forEach(t=>t.stop());R.blob=new Blob(R.chunks,{type:mr.mimeType||'audio/webm'});R.url=URL.createObjectURL(R.blob);R.dur=Math.round((Date.now()-R.t0)/1000);R.live=false;showRec();topbar()};
    if(SR){try{const rc=new SR();rc.lang='en-US';rc.continuous=true;rc.interimResults=false;rc.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)R.tr+=' '+e.results[i][0].transcript};rc.onerror=()=>{};R.rc=rc;rc.start()}catch(e){R.rc=null}}
    R.t0=Date.now();mr.start();R.live=true;$('#rb').disabled=true;$('#rs').disabled=false;$('#rst').innerHTML='<span class="rec"></span> Recording…';
  }catch(e){$('#rp').innerHTML='<div class="fb no">Không mở được micro. Em hãy bấm “Cho phép” micro cho trang này (dùng Chrome hoặc Safari) rồi thử lại.</div>'}
  R.busy=false;
}
function stopRec(){if(!R.live)return;$('#rs').disabled=true;$('#rst').textContent='Processing…';try{R.rc&&R.rc.stop()}catch(e){}setTimeout(()=>{try{R.mr.stop()}catch(e){}},R.rc?900:0)}
function showRec(){
  if(!$('#rp'))return;$('#rb').disabled=false;$('#rb').textContent='🎙 Record again';$('#rs').disabled=true;$('#rst').textContent='';
  $('#rp').innerHTML=`<audio controls src="${R.url}" style="width:100%"></audio><div class="muted">${R.dur}s · Bản ghi này sẽ được nộp cùng bài ở bước 6.</div>${R.tr.trim()?`<div class="fb">Máy nghe được: <i>${esc(R.tr.trim())}</i></div>`:''}`;
}

/* ---- scoring (ngầm, hiện sau khi nộp) ---- */
function scoreAll(){
  const r={A:0,B:0,C:0,D:0,E:0,F:0,Dd:[]};
  Object.keys(HEAD_ANS).forEach(l=>{if(S.h[l]===HEAD_ANS[l])r.A++});
  TFNG.forEach((t,i)=>{if(S.t[i]===t[1])r.B++});
  EV_ORDER.forEach((ei,i)=>{if(String(S.o[i])===String(EVENTS[ei][1]))r.C++});
  SHORT.forEach((s,i)=>{const txt=(S.d[i]||'').toLowerCase();let hit=0;const miss=[];s.k.forEach(([re,h])=>{if(new RegExp(re,'i').test(txt))hit++;else miss.push(h)});const f=txt.trim()?hit/s.k.length:0;r.D+=f;r.Dd.push({f,miss})});
  CLOZE.forEach((c,i)=>{if(S.c[i]===c[1])r.E++});
  LINKQ.forEach((c,i)=>{if(S.l[i]===c[1])r.F++});
  return r;
}

/* ---- 6 Submit ---- */
function rSub(){
  const a=cnt(S.h),b=cnt(S.t),c=cnt(S.o),d=cnt(S.d),miss=[];
  if(a<6||b<7||c<6||d<3)miss.push(`Check (${a+b+c+d}/22 ô)`);if(cnt(S.l)<8||cnt(S.c)<6)miss.push(`Words & Links (${cnt(S.l)+cnt(S.c)}/14)`);if(!wText())miss.push('bài viết');if(!(R.blob||S.audioSent))miss.push('bản ghi âm');
  const wl=detectLinks(wText());
  $('#main').innerHTML=`<div class="card"><h2>Submit</h2><p>Hệ thống sẽ gom toàn bộ bài làm, bài viết và bản ghi âm rồi gửi về cho cô. Sau khi nộp, em sẽ xem được điểm và đáp án.</p>
  <h3>Self-check</h3>${SELFCHECK.map((t,i)=>`<label class="chk"><input type="checkbox" data-g="${i}" ${S.g[i]?'checked':''}> ${esc(t)}</label>`).join('')}
  <table style="border-collapse:collapse;width:100%;margin-top:10px"><tr><th class="th">Warm-up</th><td class="td">${cnt(S.pre)}/2</td></tr><tr><th class="th">Từ đã tra</th><td class="td">${nLook()} từ</td></tr><tr><th class="th">Check (A–D)</th><td class="td">${a+b+c+d}/22 ô</td></tr><tr><th class="th">Words & Links</th><td class="td">${cnt(S.l)+cnt(S.c)}/14 ô</td></tr><tr><th class="th">Bài viết</th><td class="td">${wc(wText())} từ · ${wl.length} cụm liên kết</td></tr><tr><th class="th">Speaking</th><td class="td">${R.blob?R.dur+' giây':S.audioSent?'Đã nộp trước đó':'Chưa có ghi âm'}</td></tr><tr><th class="th">Thời gian học</th><td class="td">${fmtT(S.time)}</td></tr></table>
  ${miss.length&&!S.sent?`<div class="fb" style="margin-top:10px">Em còn thiếu: ${miss.join(', ')}. Em vẫn nộp được, hoặc quay lại làm thêm.</div>`:''}
  <div class="row" style="margin:12px 0"><button id="bp">← Speak</button><button class="pri" id="sb">${S.sent?'Submit again':'Submit to teacher'}</button></div><div id="sr">${S.sent?'<div class="fb ok">✅ Em đã nộp bài. Cô sẽ nhận xét sớm.</div>':''}</div></div><div id="res"></div>`;
  $('#bp').onclick=()=>{cur='spk';render()};$('#sb').onclick=submitAll;
  document.querySelectorAll('[data-g]').forEach(x=>x.onchange=()=>{S.g[x.dataset.g]=x.checked;save()});
  if(S.sent)showResult();
}
function showResult(){
  const r=scoreAll(),L='ABCDEF',wl=detectLinks(wText()),tl=detectLinks(R.tr||'');
  $('#res').innerHTML=`<div class="card"><h2>Your results</h2><table style="border-collapse:collapse;width:100%">
  <tr><th class="th">A · Headings</th><td class="td">${r.A}/6</td></tr><tr><th class="th">B · T/F/NG</th><td class="td">${r.B}/7</td></tr><tr><th class="th">C · Timeline</th><td class="td">${r.C}/6</td></tr><tr><th class="th">D · Short answers (máy chấm tạm)</th><td class="td">${r.D.toFixed(1)}/3</td></tr><tr><th class="th">Linking practice</th><td class="td">${r.F}/8</td></tr><tr><th class="th">Vocabulary</th><td class="td">${r.E}/6</td></tr>
  <tr><th class="th">Writing: linking phrases used</th><td class="td">${wl.length} ${wl.length?'('+wl.join(', ')+')':''}</td></tr>${R.tr.trim()?`<tr><th class="th">Speaking: linking phrases heard</th><td class="td">${tl.length} ${tl.length?'('+tl.join(', ')+')':''}</td></tr>`:''}</table>
  <h3 style="margin-top:12px">Answers</h3><p><b>A:</b> ${L.split('').map(l=>l+'–'+HEAD_ANS[l]).join(', ')}</p><p><b>B:</b> ${TFNG.map((t,i)=>(i+1)+'–'+t[1]).join(', ')}</p><p><b>C:</b> ${EV_ORDER.map(ei=>EVENTS[ei][1]).join(', ')} (theo thứ tự câu trên)</p>
  <p><b>D:</b></p><ul>${SHORT.map(s=>`<li>${esc(s.model)}</li>`).join('')}</ul><p><b>Linking practice:</b> ${LINKQ.map((c,i)=>(i+1)+'–'+c[1]).join(', ')}</p><p><b>Vocabulary:</b> ${CLOZE.map((c,i)=>(i+1)+'–'+c[1]).join(', ')}</p></div>`;
}
async function post(body){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(body)});let ok=r.ok;try{const j=await r.json();ok=j.ok!==false}catch(e){}if(!ok)throw new Error('server')}
async function submitAll(){
  $('#sb').disabled=true;$('#sr').innerHTML='<div class="fb">Đang gom bài và gửi cho cô…</div>';
  try{
    const tl=detectLinks(R.tr||'');
    if(R.blob&&!R.uploaded){
      const ext=R.blob.type.includes('mp4')?'m4a':R.blob.type.includes('ogg')?'ogg':'webm';
      await post({type:'audio',name:S.name,lesson:LESSON,file:'ChiaSeStarbucks_01.'+ext,label:'Chia sẻ: Starbucks xây dựng thương hiệu',audio:await blobB64(R.blob),mime:R.blob.type||'audio/webm',dur:R.dur,score:null,target:SFRAME.task,transcript:R.tr.trim()});
      R.uploaded=true;S.audioSent={dur:R.dur,links:tl};save();
    }
    const r=scoreAll(),wt=wText(),wl=detectLinks(wt);
    const summary={vocab:`Từ vựng ${r.E}/6 · Linking practice ${r.F}/8 · đã tra ${nLook()} từ`,gram:`Headings ${r.A}/6 · T/F/NG ${r.B}/7 · Timeline ${r.C}/6 · Short answers (máy) ${r.D.toFixed(1)}/3`,ctx:`Viết ${wc(wt)} từ · ${wl.length} cụm liên kết (${wl.join(', ')})`,
      rec:S.audioSent?`Đã nộp ghi âm chia sẻ (${S.audioSent.dur}s${S.audioSent.links&&S.audioSent.links.length?' · nghe được liên kết: '+S.audioSent.links.join(', '):''})`:'Không có ghi âm',para:`Self-check ${Object.values(S.g).filter(Boolean).length}/4 · Thời gian học ${fmtT(S.time)}`,feedback:'Reading Starbucks v2: cô chấm bài viết, short answers, ghi âm (chú ý cụm liên kết)'};
    const d=[];
    PRE.forEach((q,i)=>d.push({part:'Warm-up',question:q,answer:S.pre[i]||'',correct:'',result:''}));
    Object.keys(HEAD_ANS).forEach(l=>d.push({part:'A · Headings',question:'Paragraph '+l,answer:S.h[l]||'',correct:HEAD_ANS[l],result:S.h[l]===HEAD_ANS[l]?'đúng':'sai'}));
    TFNG.forEach((t,i)=>d.push({part:'B · T/F/NG',question:t[0],answer:S.t[i]||'',correct:t[1],result:S.t[i]===t[1]?'đúng':'sai'}));
    EV_ORDER.forEach((ei,i)=>d.push({part:'C · Timeline',question:EVENTS[ei][0],answer:String(S.o[i]||''),correct:String(EVENTS[ei][1]),result:String(S.o[i])===String(EVENTS[ei][1])?'đúng':'sai'}));
    SHORT.forEach((s,i)=>d.push({part:'D · Short answers',question:s.q,answer:S.d[i]||'',correct:s.model,result:`máy: ${Math.round(r.Dd[i].f*100)}%`+(r.Dd[i].miss.length?' · có thể thiếu: '+r.Dd[i].miss.join(', '):'')}));
    LINKQ.forEach((c,i)=>d.push({part:'Linking practice',question:c[0],answer:S.l[i]||'',correct:c[1],result:S.l[i]===c[1]?'đúng':'sai'}));
    CLOZE.forEach((c,i)=>d.push({part:'Vocabulary',question:c[0],answer:S.c[i]||'',correct:c[1],result:S.c[i]===c[1]?'đúng':'sai'}));
    WFRAME.parts.forEach((p,i)=>d.push({part:'Writing · '+p.h,question:WFRAME.task,answer:S.wp[i]||'',correct:'',result:i===3?wc(wt)+' từ · '+wl.length+' cụm liên kết':''}));
    d.push({part:'Speaking',question:SFRAME.task,answer:R.tr.trim(),correct:'',result:S.audioSent?'đã gửi file ghi âm':'không có'});
    d.push({part:'Self-check',question:'Em đã làm được',answer:SELFCHECK.filter((_,i)=>S.g[i]).join(' | '),correct:'',result:''});
    d.push({part:'Tra từ',question:'Các từ đã tra',answer:Object.keys(S.look).join(', '),correct:'',result:nLook()+' từ'});
    await post({type:'submit',name:S.name,lesson:LESSON,summary,details:d});
    S.sent=true;save();topbar();rSub();
  }catch(e){$('#sr').innerHTML='<div class="fb no">Chưa gửi được. Em kiểm tra mạng rồi bấm lại nhé. Bài của em vẫn được giữ nguyên.</div>';$('#sb').disabled=false}
}

/* ---- gate ---- */
function showApp(){$('#gate').hidden=true;$('#app').hidden=false;$('#who').textContent='Học sinh: '+S.name;cur='goal';render()}
$('#go').onclick=()=>{const v=$('#nm').value.trim();if(!v){$('#nm').focus();return}S.name=v;save();showApp()};
$('#nm').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#rename').onclick=()=>{S.name='';save();$('#app').hidden=true;$('#gate').hidden=false;$('#nm').value='';$('#nm').focus()};
if(S.name)showApp();else $('#gate').hidden=false;

</script>
