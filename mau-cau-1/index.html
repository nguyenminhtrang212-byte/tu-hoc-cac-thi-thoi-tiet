<style>
/* Layout idea: one narrow column. Header with progress, two modes (cards, dictation), one large card at a time. */
:root {

@media (prefers-color-scheme: dark) {

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
  --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
  color-scheme: dark;

* { box-sizing: border-box; }

const store = {
  get(k, d) { try { const v = localStorage.getItem("mc_" + D.id + "_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mc_" + D.id + "_" + k, JSON.stringify(v)); } catch (e) {} }
};
let known = new Set(store.get("known", []));
let opts = Object.assign({ ipa: true, auto: true }, store.get("opts", {}));
const best = store.get("best", {});
const S = { tab: "cards", theme: "all", onlyNew: false, idx: 0, dict: null };

/* ---------- speech ---------- */
const hasTTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /(Samantha|Google US English|Aria|Jenny|Natural)/i.test(v.name))
    || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let token = 0;
function say(list, o) {
  o = o || {};
  if (!hasTTS) return;
  try { speechSynthesis.cancel(); } catch (e) {}
  const my = ++token; let i = 0;
  const next = () => {
    if (my !== token) return;
    if (i >= list.length) { if (o.onEnd) o.onEnd(); return; }
    const idx = i++;
    const u = new SpeechSynthesisUtterance(list[idx]);
    u.lang = "en-US"; if (voice) u.voice = voice;
    u.rate = o.slow ? 0.6 : 0.9;
    u.onstart = () => { if (my === token && o.onSentence) o.onSentence(idx); };
    u.onend = () => setTimeout(next, o.slow ? 500 : 250);
    u.onerror = () => { if (my === token) next(); };
    try { speechSynthesis.speak(u); } catch (e) { if (my === token) setTimeout(next, 0); }
  };
  setTimeout(next, 60);
}
const stopSay = () => { token++; try { if (hasTTS) speechSynthesis.cancel(); } catch (e) {} };

/* ---------- header ---------- */
function renderHeader() {
  const n = D.items.filter(it => known.has(it.id)).length;
  $("#progText").textContent = "Đã nhớ " + n + "/" + D.items.length + " mẫu câu";
  $("#progBar").style.width = Math.round(n / D.items.length * 100) + "%";
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
}

/* ---------- 1. Flashcards ---------- */
const cardItems = () => D.items.filter(it => (S.theme === "all" || it.theme === S.theme) && (!S.onlyNew || !known.has(it.id)));
function highlight(root, i) { root.querySelectorAll("[data-i]").forEach(e => e.classList.toggle("speaking", +e.dataset.i === i)); }
function readCard(it, slow) {
  const card = $(".card");
  say(it.s.map(x => x.en), { slow, onSentence: i => card && highlight(card, i), onEnd: () => card && highlight(card, -1) });
}
function renderCards(auto) {
  const root = $("#panel"); root.replaceChildren();
  const themes = ["all", ...Object.keys(THEMES).filter(t => D.items.some(it => it.theme === t))];
  root.append(h("div", { class: "chips" }, themes.map(t => h("button", { class: "chip", type: "button", "aria-pressed": S.theme === t,
    onclick: () => { S.theme = t; S.idx = 0; renderCards(true); } }, t === "all" ? "Tất cả" : THEMES[t]))));
  root.append(h("div", { class: "opts" },
    h("label", null, h("input", { type: "checkbox", checked: opts.auto ? "" : null, onchange: e => { opts.auto = e.target.checked; store.set("opts", opts); } }), "Tự đọc khi chuyển thẻ"),
    h("label", null, h("input", { type: "checkbox", checked: opts.ipa ? "" : null, onchange: e => { opts.ipa = e.target.checked; store.set("opts", opts); renderCards(false); } }), "Hiện IPA"),
    h("label", null, h("input", { type: "checkbox", checked: S.onlyNew ? "" : null, onchange: e => { S.onlyNew = e.target.checked; S.idx = 0; renderCards(true); } }), "Chỉ thẻ chưa nhớ")));
  const list = cardItems();
  if (!list.length) { root.append(h("div", { class: "empty" }, "Em đã nhớ hết thẻ trong nhóm này. Hãy sang phần Nghe chép lại để kiểm tra.")); return; }
  if (S.idx >= list.length) S.idx = 0;
  const it = list[S.idx];

  const front = h("div", { "data-side": "front" },
    it.s.map((x, i) => h("div", { class: "sent", "data-i": i, onclick: ev => { ev.stopPropagation(); say([x.en], { onSentence: () => highlight(card, i), onEnd: () => highlight(card, -1) }); } },
      h("div", { class: "en" }, x.en),
      opts.ipa ? h("div", { class: "ipa" }, "/" + x.ipa + "/") : null)),
    h("div", { class: "hint", style: "margin-top:10px" }, "Chạm vào một câu để nghe riêng câu đó. Chạm vào khoảng trống của thẻ để xem nghĩa."));
  const back = h("div", { "data-side": "back", hidden: "" },
    it.s.map((x, i) => h("div", { class: "sent", "data-i": i, onclick: ev => { ev.stopPropagation(); say([x.en], { onSentence: () => highlight(card, i), onEnd: () => highlight(card, -1) }); } },
      h("div", { class: "small-en" }, x.en),
      h("div", { class: "vi" }, x.vi))),
    h("div", { class: "tag", style: "margin-top:8px" }, "Từ khóa"),
    h("div", { class: "kws" }, it.kw.map(k => h("button", { class: "kw", type: "button", onclick: ev => { ev.stopPropagation(); say([k[0].replace(/…/g, "")]); } },
      h("b", null, k[0]), h("span", { class: "p" }, "/" + k[1] + "/"), h("span", null, k[2])))));
  const flip = () => { const f = front.hidden; front.hidden = !f; back.hidden = f; flipBtn.textContent = f ? "🔄 Xem nghĩa" : "🔄 Xem câu"; };
  const card = h("div", { class: "card", onclick: flip }, h("div", { class: "tag" }, THEME_LONG[it.theme] + " · " + (S.idx + 1) + "/" + list.length + (known.has(it.id) ? " · đã nhớ ✓" : "")), front, back);
  const flipBtn = h("button", { class: "btn", type: "button", onclick: flip }, "🔄 Xem nghĩa");
  root.append(card);

  const go = d => { S.idx = (S.idx + d + list.length) % list.length; renderCards(true); };
  const mark = ok => {
    if (ok) known.add(it.id); else known.delete(it.id);
    store.set("known", [...known]); renderHeader();
    if (!(ok && S.onlyNew)) S.idx = (S.idx + 1) % list.length;
    renderCards(true);
  };
  root.append(h("div", { class: "row" },
    h("button", { class: "btn", type: "button", "aria-label": "Thẻ trước", onclick: () => go(-1) }, "⏮"),
    h("button", { class: "btn primary", type: "button", onclick: () => readCard(it, false) }, "🔊 Nghe lại"),
    h("button", { class: "btn", type: "button", onclick: () => readCard(it, true) }, "🐢 Nghe chậm"),
    flipBtn,
    h("button", { class: "btn", type: "button", "aria-label": "Thẻ sau", onclick: () => go(1) }, "⏭")));
  root.append(h("div", { class: "row spread" },
    h("button", { class: "btn warm", type: "button", onclick: () => mark(false) }, "Chưa nhớ"),
    h("button", { class: "btn primary", type: "button", onclick: () => mark(true) }, "Đã nhớ")));
  if (auto && opts.auto) readCard(it, false);
}

/* ---------- 2. Dictation ---------- */
const tok = s => norm(s).replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean);
const K = w => w.replace(/'/g, "");
function align(E, T) {
  const n = E.length, m = T.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = K(E[i]) === K(T[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ex = [], st = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (K(E[i]) === K(T[j])) { ex.push([E[i], "ok"]); st.push([T[j], "ok"]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ex.push([E[i], "bad"]); i++; }
    else { st.push([T[j], "extra"]); j++; }
  }
  while (i < n) ex.push([E[i++], "bad"]);
  while (j < m) st.push([T[j++], "extra"]);
  return { ex, st, ok: ex.filter(x => x[1] === "ok").length };
}
const fullEn = it => it.s.map(x => x.en);
const maskOf = text => text.split(" ").map(w => w.replace(/[A-Za-z0-9]+/g, m => m[0] + "_".repeat(m.length - 1))).join(" ");
function newDict() {
  S.dict = { order: shuffle(D.items.map(x => x.id)), i: 0, plays: 0, first: {}, checked: false, hint: false, text: "", scores: {} };
}
function playDict(slow) { const it = D.items.find(x => x.id === S.dict.order[S.dict.i]); S.dict.plays++; const c = $("#plays"); if (c) c.textContent = "Đã nghe " + S.dict.plays + " lần"; say(fullEn(it), { slow }); }
function renderDict(auto) {
  const root = $("#panel"); root.replaceChildren();
  if (!S.dict) newDict();
  const Q = S.dict;
  if (Q.i >= Q.order.length) { renderDictSummary(root); return; }
  const it = D.items.find(x => x.id === Q.order[Q.i]);
  const words = fullEn(it).join(" ").split(/\s+/).length;
  const ta = h("textarea", { id: "dtext", rows: "4", placeholder: "Gõ lại những gì em nghe được…", "aria-label": "Bài chép", spellcheck: "false", autocapitalize: "off", oninput: e => { Q.text = e.target.value; } });
  ta.value = Q.text;
  const res = h("div", { "aria-live": "polite", style: "margin-top:14px" });
  const showResult = (scoreOverride) => {
    const E = tok(fullEn(it).join(" ")), T = tok(Q.text), a = align(E, T);
    const sc = scoreOverride !== undefined ? scoreOverride : (Q.text.trim() ? Math.round(a.ok / Math.max(E.length, T.length) * 100) : 0);
    if (!(it.id in Q.scores)) { Q.scores[it.id] = sc; if (sc > (best[it.id] || 0)) { best[it.id] = sc; store.set("best", best); } }
    Q.checked = true; res.replaceChildren();
    if (scoreOverride === undefined) {
      res.append(h("div", { class: "score " + (sc >= 80 ? "ok" : "bad") }, sc + "%"),
        h("div", { class: "mini" }, "Em viết:"),
        h("div", { class: "diff" }, a.st.length ? a.st.flatMap(([w, k]) => [h("span", { class: k === "ok" ? "ok" : "extra" }, w), " "]) : h("span", { class: "mini" }, "(trống)")));
    }
    res.append(h("div", { class: "mini" }, "Đáp án:"),
      h("div", { class: "diff" }, a.ex.flatMap(([w, k]) => [h("span", { class: k === "ok" ? "ok" : "bad" }, w), " "])),
      ...it.s.map(x => h("div", { style: "margin-bottom:8px" }, h("div", { class: "en", style: "font-size:1.1rem" }, x.en), h("div", { class: "ipa" }, "/" + x.ipa + "/"), h("div", { class: "vi" }, x.vi))),
      h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: () => { Q.i++; Q.plays = 0; Q.checked = false; Q.hint = false; Q.text = ""; renderDict(true); } }, Q.i + 1 < Q.order.length ? "Câu tiếp ▶" : "Xem kết quả")));
  };
  root.append(h("div", { class: "panel" },
    h("div", { class: "row spread", style: "margin:0 0 10px" }, h("span", { class: "tag" }, THEME_LONG[it.theme] + " · Câu " + (Q.i + 1) + "/" + Q.order.length), h("span", { class: "mini", id: "plays" }, "Đã nghe " + Q.plays + " lần")),
    h("div", { class: "mini" }, "Nghe rồi gõ lại cả " + it.s.length + " câu. Câu có " + words + " từ. Không cần gõ hoa thường; dấu câu và dấu nháy (') không bị trừ điểm."),
    h("div", { class: "row" },
      h("button", { class: "btn primary", type: "button", onclick: () => playDict(false) }, "🔊 Nghe"),
      h("button", { class: "btn", type: "button", onclick: () => playDict(true) }, "🐢 Nghe chậm")),
    h("div", { style: "margin-top:12px" }, ta),
    Q.hint ? h("div", { class: "mask mini", style: "margin-top:8px" }, "Gợi ý: " + fullEn(it).map(maskOf).join(" ")) : null,
    h("div", { class: "row" },
      h("button", { class: "btn primary", type: "button", disabled: Q.checked ? "" : null, onclick: () => showResult() }, "Kiểm tra"),
      h("button", { class: "btn", type: "button", onclick: () => { Q.hint = true; renderDict(false); } }, "Gợi ý chữ cái đầu"),
      h("button", { class: "btn warm", type: "button", disabled: Q.checked ? "" : null, onclick: () => showResult(0) }, "Xem đáp án")),
    res));
  if (Q.checked) showResult();
  if (auto) playDict(false);
}
function renderDictSummary(root) {
  const Q = S.dict, ids = Object.keys(Q.scores), avg = ids.length ? Math.round(ids.reduce((a, k) => a + Q.scores[k], 0) / ids.length) : 0;
  const weak = D.items.filter(it => (Q.scores[it.id] || 0) < 80);
  root.append(h("div", { class: "panel" },
    h("h2", { style: "margin:0 0 4px;font-family:var(--font-display)" }, "Kết quả vòng này: " + avg + "%"),
    h("p", { class: "mini" }, weak.length ? "Có " + weak.length + " mẫu câu cần ôn lại bằng thẻ nhớ." : "Tuyệt vời! Em đã chép đúng hầu hết các câu."),
    weak.map(it => h("div", { class: "weak" }, h("div", null, h("div", { class: "tag" }, THEMES[it.theme] + " · " + (Q.scores[it.id] || 0) + "%"), h("div", null, it.s.map(x => x.en).join(" "))),
      h("button", { class: "btn", type: "button", onclick: () => { S.tab = "cards"; S.theme = "all"; S.onlyNew = false; S.idx = D.items.indexOf(it); render(true); } }, "Ôn thẻ"))),
    h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: () => { newDict(); renderDict(true); } }, "Làm vòng mới"))));
}

/* ---------- wiring ---------- */
function render(auto) {
  renderHeader();
  stopSay();
  if (S.tab === "cards") renderCards(!!auto); else renderDict(!!auto);
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; render(S.tab === "dict"); }));
document.addEventListener("keydown", e => {
  if (S.tab !== "cards" || /TEXTAREA|INPUT/.test((e.target.tagName || ""))) return;
  const btns = document.querySelectorAll(".row .btn");
  if (e.key === "ArrowRight") { const b = document.querySelector('[aria-label="Thẻ sau"]'); b && b.click(); }
  if (e.key === "ArrowLeft") { const b = document.querySelector('[aria-label="Thẻ trước"]'); b && b.click(); }
});
if (!hasTTS) $("#banner").append(h("div", { class: "banner" }, "Trình duyệt này chưa hỗ trợ giọng đọc. Hãy mở trang bằng Chrome hoặc Safari."));
else $("#banner").append(h("div", { class: "banner" }, "Em hãy bật loa. Mỗi lần bấm chuyển thẻ, máy sẽ tự đọc cả mẫu câu."));
render(false);
</script>
</body>
</html>
