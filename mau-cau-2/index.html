<head>

<style>
/* Layout idea: one narrow column. Header with progress, two modes (cards, dictation), one large card at a time. */
:root {
  --bg: #f3f7f6; --surface: #ffffff; --ink: #14282b; --muted: #566b6e; --line: #d4e1df;
  --accent: #0e7c7b; --accent-ink: #ffffff; --soft: #e1f0ee; --warm: #c8531f;
  --good: #1b7f45; --bad: #b83227; --mark: #fff0c2;
  --font-display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
    --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
  --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.55; font-size: 16px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 span { color: var(--warm); }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 56ch; }
a.link { color: var(--accent); font-weight: 600; text-decoration: none; border: 1.5px solid var(--accent); border-radius: 10px; padding: 7px 14px; white-space: nowrap; }
a.link:hover { background: var(--soft); }
.prog { display: flex; align-items: center; gap: 12px; font-size: .9rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); margin-bottom: 18px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--warm); font-weight: 600; }
button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: .88rem; padding: 5px 12px; border-radius: 99px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: .9rem; color: var(--muted); }
.opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px 20px; min-height: 260px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; }
.tag { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--warm); font-weight: 600; }
.sent { border-radius: 10px; padding: 6px 10px; margin: 0 -10px; cursor: pointer; transition: background .15s; }
.sent:hover { background: var(--soft); }
.sent.speaking { background: var(--mark); }
.en { font-family: var(--font-display); font-size: clamp(1.25rem, 4.2vw, 1.6rem); line-height: 1.25; text-wrap: balance; }
.ipa { color: var(--accent); font-size: .95rem; margin-top: 2px; word-break: break-word; }
.vi { color: var(--ink); font-size: 1.05rem; }
.small-en { color: var(--muted); font-size: .9rem; }
.kws { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.kw { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.kw b { display: block; font-weight: 600; }
.kw span { display: block; font-size: .82rem; color: var(--muted); }
.kw .p { color: var(--accent); }
.hint { color: var(--muted); font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.row.spread { justify-content: space-between; }
.btn { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.warm { border-color: var(--warm); color: var(--warm); }
.btn:disabled { opacity: .45; cursor: default; }
.mini { font-size: .88rem; color: var(--muted); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 20px; }
textarea { width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 120px; }
.ok { color: var(--good); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }
.extra { color: var(--bad); text-decoration: line-through; }
.diff { margin: 6px 0 12px; line-height: 1.9; }
.diff { overflow-wrap: anywhere; }
.score { font-family: var(--font-display); font-size: 1.6rem; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.mask { letter-spacing: .04em; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
.banner { background: var(--mark); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .92rem; }
.weak { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
@media (prefers-reduced-motion: reduce) { .bar > i, .sent { transition: none; } }
</style>
</head>

        <p class="sub">15 mẫu câu mở rộng, nhắc lại từ vựng của bài 1. Học bằng thẻ nhớ, rồi nghe và chép lại.</p>

<script>
const D = {"id": "mau-cau-2", "items": [{"id": "b01", "theme": "me", "s": [{"en": "I've had a persistent cough for three days.", "ipa": "aɪv hæd ə pərˈsɪstənt kɔːf fər θriː deɪz", "vi": "Mình bị ho dai dẳng ba ngày rồi."}, {"en": "My throat hurts when I swallow.", "ipa": "maɪ θroʊt hɝːts wɛn aɪ ˈswɑːloʊ", "vi": "Họng mình đau khi nuốt."}, {"en": "I also have a runny nose, and I feel exhausted.", "ipa": "aɪ ˈɔːlsoʊ hæv ə ˈrʌni noʊz ənd aɪ fiːl ɪɡˈzɔːstɪd", "vi": "Mình còn bị sổ mũi và thấy kiệt sức."}], "kw": [["persistent cough", "pərˈsɪstənt kɔːf", "ho dai dẳng"], ["swallow", "ˈswɑːloʊ", "nuốt"], ["exhausted", "ɪɡˈzɔːstɪd", "kiệt sức"]]}, {"id": "b02", "theme": "me", "s": [{"en": "I woke up with a high temperature and chills.", "ipa": "aɪ woʊk ʌp wɪð ə haɪ ˈtɛmprətʃər ənd tʃɪlz", "vi": "Mình thức dậy với cơn sốt cao và ớn lạnh."}, {"en": "My whole body aches.", "ipa": "maɪ hoʊl ˈbɑːdi eɪks", "vi": "Cả người mình đau nhức."}, {"en": "I think I've come down with the flu.", "ipa": "aɪ θɪŋk aɪv kʌm daʊn wɪð ðə fluː", "vi": "Mình nghĩ là mình bị cúm."}], "kw": [["chills", "tʃɪlz", "ớn lạnh"], ["ache", "eɪk", "đau nhức"], ["come down with", "kʌm daʊn wɪð", "bị (bệnh)"]]}, {"id": "b03", "theme": "me", "s": [{"en": "I've been feeling dizzy since yesterday.", "ipa": "aɪv bɪn ˈfiːlɪŋ ˈdɪzi sɪns ˈjɛstərdeɪ", "vi": "Mình thấy chóng mặt từ hôm qua."}, {"en": "I get a headache whenever I stand up quickly.", "ipa": "aɪ ɡɛt ə ˈhɛdeɪk wɛnˈɛvər aɪ stænd ʌp ˈkwɪkli", "vi": "Mình bị đau đầu mỗi khi đứng dậy nhanh."}, {"en": "I didn't sleep well last night.", "ipa": "aɪ ˈdɪdnt sliːp wɛl læst naɪt", "vi": "Đêm qua mình ngủ không ngon."}, {"en": "Maybe that's why I feel so weak.", "ipa": "ˈmeɪbi ðæts waɪ aɪ fiːl soʊ wiːk", "vi": "Có lẽ vì vậy mà mình thấy yếu người."}], "kw": [["dizzy", "ˈdɪzi", "chóng mặt"], ["whenever", "wɛnˈɛvər", "mỗi khi"], ["weak", "wiːk", "yếu"]]}, {"id": "b04", "theme": "ask", "s": [{"en": "You don't look well.", "ipa": "ju doʊnt lʊk wɛl", "vi": "Trông bạn không khỏe."}, {"en": "Did you catch a cold?", "ipa": "dɪd ju kætʃ ə koʊld", "vi": "Bạn bị cảm lạnh à?"}, {"en": "How long have you been feeling like this?", "ipa": "haʊ lɔːŋ hæv ju bɪn ˈfiːlɪŋ laɪk ðɪs", "vi": "Bạn bị như thế này bao lâu rồi?"}], "kw": [["catch a cold", "kætʃ ə koʊld", "bị cảm lạnh"], ["how long", "haʊ lɔːŋ", "bao lâu"]]}, {"id": "b05", "theme": "ask", "s": [{"en": "Have you seen a doctor yet?", "ipa": "hæv ju siːn ə ˈdɑːktər jɛt", "vi": "Bạn đã đi khám bác sĩ chưa?"}, {"en": "What did the doctor say?", "ipa": "wʌt dɪd ðə ˈdɑːktər seɪ", "vi": "Bác sĩ nói gì?"}, {"en": "Are you taking any medicine?", "ipa": "ɑːr ju ˈteɪkɪŋ ˈɛni ˈmɛdɪsn", "vi": "Bạn có đang uống thuốc gì không?"}, {"en": "Please don't ignore it.", "ipa": "pliːz doʊnt ɪɡˈnɔːr ɪt", "vi": "Đừng bỏ qua nó nhé."}], "kw": [["see a doctor", "siː ə ˈdɑːktər", "đi khám bác sĩ"], ["medicine", "ˈmɛdɪsn", "thuốc"], ["ignore", "ɪɡˈnɔːr", "phớt lờ"]]}, {"id": "b06", "theme": "ask", "s": [{"en": "I was worried about you.", "ipa": "aɪ wʌz ˈwɝːid əˈbaʊt ju", "vi": "Mình đã lo cho bạn."}, {"en": "How are you holding up?", "ipa": "haʊ ɑːr ju ˈhoʊldɪŋ ʌp", "vi": "Dạo này bạn chống chọi thế nào rồi?"}, {"en": "Let me know if you need anything.", "ipa": "lɛt mi noʊ ɪf ju niːd ˈɛniθɪŋ", "vi": "Cần gì cứ nói với mình nhé."}], "kw": [["worried", "ˈwɝːid", "lo lắng"], ["hold up", "hoʊld ʌp", "chống chọi, cầm cự"]]}, {"id": "b07", "theme": "advice", "s": [{"en": "I strongly recommend that you rest at home and drink plenty of water.", "ipa": "aɪ ˈstrɔːŋli ˌrɛkəˈmɛnd ðæt ju rɛst æt hoʊm ənd drɪŋk ˈplɛnti əv ˈwɔːtər", "vi": "Mình đặc biệt khuyên bạn nghỉ ngơi ở nhà và uống thật nhiều nước."}, {"en": "It is important to take your medicine on time.", "ipa": "ɪt ɪz ɪmˈpɔːrtənt tə teɪk jʊr ˈmɛdɪsn ɑːn taɪm", "vi": "Điều quan trọng là uống thuốc đúng giờ."}, {"en": "You'll feel better soon.", "ipa": "jul fiːl ˈbɛtər suːn", "vi": "Bạn sẽ sớm thấy khỏe hơn thôi."}], "kw": [["recommend", "ˌrɛkəˈmɛnd", "khuyên"], ["plenty of wa     h("div", { class: "mini" }, "Nghe rồi gõ lại cả " + it.s.length + " câu. Câu có " + words + " từ. Không cần gõ hoa thường; dấu câu và dấu nháy (') không bị trừ điểm."),
    h("div", { class: "row" },
      h("button", { class: "btn primary", type: "button", onclick: () => playDict(false) }, "🔊 Nghe"),
      h("button", { class: "btn", type: "button", onclick: () => playDict(true) }, "🐢 Nghe chậm")),
    h("div", { style: "margin-top:12px" }, ta),
    Q.hint ? h("div", { class: "mask mini", style: "margin-top:8px" }, "Gợi ý: " + fullEn(it).map(maskOf).join(" ")) : null,
    h("div", { class: "row" },
      h("button", { class: "btn primary", type: "button", disabled: Q.checked ? "" : null, onclick: () => showResult() }, "Kiểm tra"),
      h("button", { class: "btn", type: "button", onclick: () => { Q.hint = true; renderDict(false); } }, "Gợi ý chữ cái đầu"),
      h("button", { class: "btn warm", type: "button", disabled: Q.checked ? "" : null, onclick: () => showResult(0) }, "Xem đáp án")),
    res));
  if (Q.checked) showResult();
  if (auto) playDict(false);
}
function renderDictSummary(root) {
  const Q = S.dict, ids = Object.keys(Q.scores), avg = ids.length ? Math.round(ids.reduce((a, k) => a + Q.scores[k], 0) / ids.length) : 0;
  const weak = D.items.filter(it => (Q.scores[it.id] || 0) < 80);
  root.append(h("div", { class: "panel" },
    h("h2", { style: "margin:0 0 4px;font-family:var(--font-display)" }, "Kết quả vòng này: " + avg + "%"),
    h("p", { class: "mini" }, weak.length ? "Có " + weak.length + " mẫu câu cần ôn lại bằng thẻ nhớ." : "Tuyệt vời! Em đã chép đúng hầu hết các câu."),
    weak.map(it => h("div", { class: "weak" }, h("div", null, h("div", { class: "tag" }, THEMES[it.theme] + " · " + (Q.scores[it.id] || 0) + "%"), h("div", null, it.s.map(x => x.en).join(" "))),
      h("button", { class: "btn", type: "button", onclick: () => { S.tab = "cards"; S.theme = "all"; S.onlyNew = false; S.idx = D.items.indexOf(it); render(true); } }, "Ôn thẻ"))),
    h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: () => { newDict(); renderDict(true); } }, "Làm vòng mới"))));
}

/* ---------- wiring ---------- */
function render(auto) {
  renderHeader();
  stopSay();
  if (S.tab === "cards") renderCards(!!auto); else renderDict(!!auto);
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; render(S.tab === "dict"); }));
document.addEventListener("keydown", e => {
  if (S.tab !== "cards" || /TEXTAREA|INPUT/.test((e.target.tagName || ""))) return;
  const btns = document.querySelectorAll(".row .btn");
  if (e.key === "ArrowRight") { const b = document.querySelector('[aria-label="Thẻ sau"]'); b && b.click(); }
  if (e.key === "ArrowLeft") { const b = document.querySelector('[aria-label="Thẻ trước"]'); b && b.click(); }
});
if (!hasTTS) $("#banner").append(h("div", { class: "banner" }, "Trình duyệt này chưa hỗ trợ giọng đọc. Hãy mở trang bằng Chrome hoặc Safari."));
else $("#banner").append(h("div", { class: "banner" }, "Em hãy bật loa. Mỗi lần bấm chuyển thẻ, máy sẽ tự đọc cả mẫu câu."));
render(false);
</script>
</body>
</html>
