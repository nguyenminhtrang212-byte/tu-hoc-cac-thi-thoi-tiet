<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing 1 · Family: Elderly parents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column. Header with progress, two modes (cards, dictation), one large card at a time. */
:root {
  --bg: #f3f7f6; --surface: #ffffff; --ink: #14282b; --muted: #566b6e; --line: #d4e1df;
  --accent: #0e7c7b; --accent-ink: #ffffff; --soft: #e1f0ee; --warm: #c8531f;
  --good: #1b7f45; --bad: #b83227; --mark: #fff0c2;
  --font-display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
    --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
  --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.55; font-size: 16px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 span { color: var(--warm); }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 56ch; }
a.link { color: var(--accent); font-weight: 600; text-decoration: none; border: 1.5px solid var(--accent); border-radius: 10px; padding: 7px 14px; white-space: nowrap; }
a.link:hover { background: var(--soft); }
.prog { display: flex; align-items: center; gap: 12px; font-size: .9rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); margin-bottom: 18px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--warm); font-weight: 600; }
button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: .88rem; padding: 5px 12px; border-radius: 99px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: .9rem; color: var(--muted); }
.opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px 20px; min-height: 260px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; }
.tag { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--warm); font-weight: 600; }
.sent { border-radius: 10px; padding: 6px 10px; margin: 0 -10px; cursor: pointer; transition: background .15s; }
.sent:hover { background: var(--soft); }
.sent.speaking { background: var(--mark); }
.en { font-family: var(--font-display); font-size: clamp(1.25rem, 4.2vw, 1.6rem); line-height: 1.25; text-wrap: balance; }
.ipa { color: var(--accent); font-size: .95rem; margin-top: 2px; word-break: break-word; }
.vi { color: var(--ink); font-size: 1.05rem; }
.small-en { color: var(--muted); font-size: .9rem; }
.kws { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.kw { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.kw b { display: block; font-weight: 600; }
.kw span { display: block; font-size: .82rem; color: var(--muted); }
.kw .p { color: var(--accent); }
.hint { color: var(--muted); font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.row.spread { justify-content: space-between; }
.btn { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.warm { border-color: var(--warm); color: var(--warm); }
.btn:disabled { opacity: .45; cursor: default; }
.mini { font-size: .88rem; color: var(--muted); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 20px; }
textarea { width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 120px; }
.ok { color: var(--good); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }
.extra { color: var(--bad); text-decoration: line-through; }
.diff { margin: 6px 0 12px; line-height: 1.9; }
.diff { overflow-wrap: anywhere; }
.score { font-family: var(--font-display); font-size: 1.6rem; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.mask { letter-spacing: .04em; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
.banner { background: var(--mark); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .92rem; }
.weak { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
@media (prefers-reduced-motion: reduce) { .bar > i, .sent { transition: none; } }

.who{font-size:.88rem;color:var(--muted)}
.who button{border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0 0 0 4px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.stepchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.stepchip[aria-selected="true"]{border-color:var(--warm);font-weight:600}
.stepchip.done{background:var(--soft)}
.scn{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.scn .vi{margin-top:6px;font-size:.95rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.wcard[data-r="know"]{border-color:var(--good);background:var(--soft)}
.wcard[data-r="unknown"]{border-color:var(--warm)}
.emo{font-size:2.4rem;line-height:1.1}.bigemo{font-size:4rem;text-align:center;line-height:1.1;margin-bottom:6px}
.wd{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
.ip{color:var(--accent);font-size:.85rem}
.spk-btn{border:0;background:none;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:4px}
.two{display:flex;gap:6px;width:100%;margin-top:4px}
.tg{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.82rem;padding:6px 4px;border-radius:8px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.step{margin:18px 0}.step h3{font-family:var(--font-display);margin:0 0 6px}
.sec{font-family:var(--font-display);margin:26px 0 8px;font-size:1.25rem}
.q{font-size:1.15rem;margin:8px 0 12px}
.opts2{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:left;padding:11px 14px;border-radius:10px;cursor:pointer}
.opt:disabled{cursor:default}.opt.good{border-color:var(--good);background:var(--soft);font-weight:600}.opt.badopt{border-color:var(--bad)}
.fb{margin-top:10px;min-height:1.2em}.fb.good{color:var(--good);font-weight:600}.fb.bad{color:var(--bad);font-weight:600}
.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin:10px 0}
.word{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:7px 12px;border-radius:10px;cursor:pointer}
.word:disabled{opacity:.3}
.btn.big{font-size:1.1rem;padding:12px 26px}.btn.fillwarm{background:var(--warm);color:#fff}
mark{background:var(--mark);color:inherit;padding:0 4px;border-radius:4px}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.line{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.recbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recbox audio{max-width:100%;height:36px}
.theory{margin:0 0 10px;padding-left:20px}.theory li{margin-bottom:6px}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
.okrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.warnlist{margin:8px 0;padding-left:20px;color:var(--bad)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#gate[hidden]{display:none}
.gbox{background:var(--surface);border-radius:16px;padding:24px;max-width:380px;width:100%}

.timebox{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.92rem;font-weight:600;color:var(--accent)}
.pg{font-family:var(--font-display);margin:0 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.vibox{background:var(--soft);border-radius:10px;padding:10px 12px}
.vtxt{font-size:1.02rem;margin-top:4px}
.entbox textarea{min-height:90px}
.analysis{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;font-size:.95rem}
.revealed{background:var(--mark);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tagpill{background:var(--accent);color:var(--accent-ink);font-size:.76rem;padding:2px 9px;border-radius:99px}
.chipst{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin-left:6px}
.chipst.good{background:var(--good);color:#fff;border-color:var(--good)}.chipst.mid{background:var(--mark)}.chipst.rev{background:var(--warm);color:#fff;border-color:var(--warm)}
.stickyscore{position:sticky;top:0;z-index:5;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.scorebig{font-family:var(--font-display);font-size:1.7rem;color:var(--accent)}
select{font:inherit;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate" hidden><div class="gbox"><div class="bigemo" aria-hidden="true">✍️</div><h2 style="font-family:var(--font-display);margin:0 0 6px;text-align:center">Em tên là gì?</h2><p class="mini" style="text-align:center">Cô cần biết tên để nhận bài của em.</p><label for="gname" class="mini">Họ và tên</label><input type="text" id="gname" autocomplete="name"><div class="row"><button class="btn primary" id="gok" type="button">Bắt đầu</button></div></div></div>
<div class="wrap">
<header><div class="top"><div><h1>Writing <span>· Family: Elderly parents</span></h1><p class="sub">Học từ vựng, nghĩ ý bằng tiếng mẹ đẻ rồi dịch một bài học thuật theo từng cụm. Xem gợi ý sẽ bị trừ điểm.</p></div></div>
<div class="who"><span id="whoText"></span><button type="button" id="rename">Đổi tên</button></div>
<div class="prog"><span id="progText"></span><div class="bar"><i id="progBar" style="width:0%"></i></div></div></header>
<div class="timebox" id="timeBox" aria-live="off"></div>
<div id="banner"></div>
<div class="steps" id="steps" role="tablist" aria-label="Các bước"></div>
<main id="panel"></main>
</div>
<div id="toast" role="status"></div>
<script>
/* ===== CONTENT: Writing 1 - [Family] Elderly parents (Discuss both views + opinion) ===== */
const VOC = [
  { id: "task", title: "Từ để giải đề & dựng cấu trúc", words: [
    { w: "discuss both views", ipa: "dɪˈskʌs bəʊθ vjuːz", vi: "thảo luận cả hai quan điểm", ex: "In this essay, I will discuss both views." },
    { w: "give your opinion", ipa: "ɡɪv jɔː əˈpɪnjən", vi: "nêu ý kiến của em", ex: "The task also asks you to give your opinion." },
    { w: "introduction", ipa: "ˌɪntrəˈdʌkʃn", vi: "mở bài", ex: "The introduction should be short and clear." },
    { w: "paraphrase", ipa: "ˈpærəfreɪz", vi: "diễn đạt lại bằng từ khác", ex: "Do not copy the question. Paraphrase it." },
    { w: "thesis statement", ipa: "ˈθiːsɪs ˈsteɪtmənt", vi: "câu nêu quan điểm chính của bài", ex: "My thesis statement is in the first paragraph." },
    { w: "topic sentence", ipa: "ˈtɒpɪk ˈsentəns", vi: "câu chủ đề của đoạn", ex: "Each paragraph begins with a topic sentence." },
    { w: "supporting idea", ipa: "səˈpɔːtɪŋ aɪˈdɪə", vi: "ý hỗ trợ (giải thích, ví dụ)", ex: "Every main idea needs a supporting idea." },
    { w: "counter-argument", ipa: "ˈkaʊntər ˈɑːɡjumənt", vi: "lập luận phản biện (ý kiến đối lập)", ex: "A good essay mentions one counter-argument." },
    { w: "outweigh", ipa: "ˌaʊtˈweɪ", vi: "nặng ký hơn, quan trọng hơn", ex: "I think the benefits outweigh the problems." },
    { w: "for instance", ipa: "fər ˈɪnstəns", vi: "ví dụ như", ex: "Many old people feel useful. For instance, they help with homework." },
    { w: "in addition", ipa: "ɪn əˈdɪʃn", vi: "ngoài ra, thêm vào đó", ex: "In addition, nursing homes can be expensive." },
    { w: "however", ipa: "haʊˈevə", vi: "tuy nhiên", ex: "Nursing homes are safe. However, they can be lonely." },
    { w: "although", ipa: "ɔːlˈðəʊ", vi: "mặc dù", ex: "Although it is expensive, many families choose it." },
    { w: "therefore", ipa: "ˈðeəfɔː", vi: "vì vậy, do đó", ex: "Adults work all day. Therefore, they cannot care for their parents." },
    { w: "in most cases", ipa: "ɪn məʊst ˈkeɪsɪz", vi: "trong hầu hết trường hợp", ex: "Home care is better in most cases." },
    { w: "in conclusion", ipa: "ɪn kənˈkluːʒn", vi: "tóm lại", ex: "In conclusion, family care is better." }
  ] },
  { id: "topic", title: "Từ về chủ đề Gia đình & người cao tuổi", words: [
    { w: "elderly", ipa: "ˈeldəli", vi: "cao tuổi (tính từ)", ex: "Elderly people often need help." },
    { w: "nursing home", ipa: "ˈnɜːsɪŋ həʊm", vi: "viện dưỡng lão", ex: "My grandmother does not want a nursing home." },
    { w: "look after", ipa: "lʊk ˈɑːftə", vi: "chăm sóc", ex: "Who will look after the old man?" },
    { w: "health problem", ipa: "helθ ˈprɒbləm", vi: "vấn đề sức khỏe", ex: "Heart disease is a serious health problem." },
    { w: "lonely", ipa: "ˈləʊnli", vi: "cô đơn", ex: "She feels lonely after her husband died." },
    { w: "pass away", ipa: "pɑːs əˈweɪ", vi: "qua đời (cách nói nhẹ nhàng)", ex: "If her husband must pass away, she will live alone." },
    { w: "mental health", ipa: "ˈmentl helθ", vi: "sức khỏe tinh thần", ex: "Friends are good for mental health." },
    { w: "feel useful", ipa: "fiːl ˈjuːsfl", vi: "cảm thấy mình có ích", ex: "Old people feel useful when they cook for the family." },
    { w: "grandchildren", ipa: "ˈɡræntʃɪldrən", vi: "các cháu (nội, ngoại)", ex: "He plays with his grandchildren every day." },
    { w: "afford", ipa: "əˈfɔːd", vi: "đủ tiền để chi trả", ex: "Not every family can afford a nursing home." },
    { w: "duty", ipa: "ˈdjuːti", vi: "bổn phận, nghĩa vụ", ex: "Caring for parents is a duty in Vietnam." },
    { w: "guilty", ipa: "ˈɡɪlti", vi: "cảm thấy có lỗi", ex: "Children may feel guilty if they send parents away." },
    { w: "habit", ipa: "ˈhæbɪt", vi: "thói quen", ex: "Old and young people have different habits." },
    { w: "react", ipa: "riˈækt", vi: "phản ứng, xử lý", ex: "Nurses can react quickly in an emergency." }
  ] }
];

/* ---- Step 2: planning (write in any language) ---- */
const TASK_TYPES = [
  { t: "Chỉ nêu ý kiến: đồng ý hay không đồng ý", ok: false },
  { t: "Thảo luận cả hai quan điểm VÀ nêu ý kiến của em", ok: true },
  { t: "Nêu ưu điểm và nhược điểm của một vấn đề", ok: false },
  { t: "Nêu nguyên nhân và giải pháp", ok: false }
];
const PLAN_FIELDS = [
  { id: "ask", g: "A. Đọc đề", q: "Đề bài hỏi em điều gì? Hãy diễn đạt lại bằng lời của em.", ph: "Ví dụ: Đề hỏi người già nên sống với con hay ở viện…" },
  { id: "kw", g: "A. Đọc đề", q: "Gạch ra 3–5 từ khoá của đề (viết tiếng Anh hoặc tiếng Việt).", ph: "elderly parents, live with, nursing homes…" },
  { id: "v1a", g: "B. Quan điểm 1: Viện dưỡng lão tốt hơn", q: "Lý do 1 của người ủng hộ viện dưỡng lão là gì? Vì sao lý do đó hợp lý?", ph: "Viết suy nghĩ của em: lý do → giải thích → ví dụ" },
  { id: "v1b", g: "B. Quan điểm 1: Viện dưỡng lão tốt hơn", q: "Lý do 2 của họ là gì?", ph: "…" },

  if (!hasTTS) return;

let token = 0;
function say(list, o) {
  o = o || {};

  try { speechSynthesis.cancel(); } catch (e) {}
  const my = ++token; let i = 0;
  const next = () => {
    if (my !== token) return;

    const idx = i++;

  };

  function updPlanGate() { const n = filled(); sampleBtn.disabled = n < 5; gate.textContent = n < 5 ? "Viết ít nhất 5 ô (mỗi ô từ 3 từ) để mở dàn ý mẫu. Hiện có " + n + "/" + PLAN_FIELDS.length + " ô." : "Em đã viết đủ. Hãy so sánh với dàn ý mẫu nhé."; }
  updPlanGate();
  root.append(h("h3", { class: "sec" }, "F. So sánh với dàn ý mẫu"), h("div", { class: "line" }, gate, h("div", { class: "row", style: "margin-top:0" }, sampleBtn), sample));
  root.append(h("div", { class: "row spread" }, h("span", { class: "mini" }, "Bài của em được tự lưu trên máy này."), h("button", { class: "btn primary", type: "button", onclick: () => go("trans") }, "Sang mục 3 →")));
}

/* =====================================================
   3. PARALLEL TRANSLATION with penalty hints
   ===================================================== */
const CH = PARAS.flatMap((p, pi) => p.chunks.map((c, ci) => Object.assign({ id: pi + "-" + ci, pi, ci }, c)));
const TR = store.get("tr", {}); // id -> {text, score, revealed, checked}
const saveTr = () => store.set("tr", TR);
const trOf = c => TR[c.id] || (TR[c.id] = { text: "", score: 0, revealed: false, checked: false });
function scoreChunk(c, text) {
  const words = text.trim().split(/\s+/).filter(Boolean); if (!words.length) return { s: 0, hit: [], miss: c.k.map(x => x[1]) };
  const hit = [], miss = [];
  c.k.forEach(([re, hint]) => (new RegExp(re, "i").test(text) ? hit : miss).push(hint));
  const need = Math.max(3, Math.round(c.en.split(/\s+/).length * 0.6));
  return { s: Math.round(hit.length / c.k.length * Math.min(1, words.length / need) * 100) / 100, hit, miss, short: words.length < need };
}
const pct = () => Math.round(CH.reduce((a, c) => a + (trOf(c).revealed ? 0 : trOf(c).score), 0) / CH.length * 100);
let scoreEl = null;
function updScore() {
  if (!scoreEl) return;
  const done = CH.filter(c => trOf(c).checked || trOf(c).revealed).length, rev = CH.filter(c => trOf(c).revealed).length;
  scoreEl.replaceChildren(h("span", { class: "scorebig" }, pct() + "%"), h("span", { class: "mini" }, " Điểm dịch · đã làm " + done + "/" + CH.length + " · đã xem gợi ý " + rev));
}
function renderTrans() {
  const root = $("#panel"); root.replaceChildren();
  root.append(h("div", { class: "scn" }, h("strong", null, "Bước 3: Dịch Việt → Anh, theo từng cụm. "), "Bên trái là bản tiếng Việt, bên phải là bài dịch của em. Bấm “Kiểm tra” để máy chấm các ý chính và hiện phân tích cấu trúc. ",
    h("strong", null, "Nếu bấm xem bản tiếng Anh, cụm đó tính 0 điểm."),
    h("div", { class: "vi" }, "Điểm = trung bình % của tất cả các cụm. Em có thể sửa và kiểm tra lại nhiều lần.")));
  scoreEl = h("div", { class: "stickyscore", "aria-live": "polite" }); root.append(scoreEl);
  PARAS.forEach((p, pi) => {
    root.append(h("h3", { class: "sec" }, p.title));
    CH.filter(c => c.pi === pi).forEach(c => root.append(chunkRow(c)));
  });
  updScore();
  root.append(h("div", { class: "row spread" }, h("span", { class: "mini" }, "Bài dịch được tự lưu trên máy này."), h("button", { class: "btn primary", type: "button", onclick: () => go("submit") }, "Sang mục 4 →")));
}
function chunkRow(c) {
  const st = trOf(c), row = h("div", { class: "pair", id: "row-" + c.id });
  const draw = () => {
    row.replaceChildren();
    const left = h("div", { class: "vibox" }, h("div", { class: "mini" }, "Bản cần dịch · cụm " + (c.ci + 1)), h("div", { class: "vtxt" }, c.vi));
    const ta = h("textarea", { rows: "3", placeholder: "Dịch sang tiếng Anh…", "aria-label": "Bài dịch: " + c.vi }); ta.value = st.text;
    ta.addEventListener("input", () => { st.text = ta.value; saveTr(); });
    const chip = h("span", { class: "chipst" + (st.revealed ? " rev" : st.checked ? (st.score >= 0.8 ? " good" : " mid") : "") }, st.revealed ? "Đã xem gợi ý · 0%" : st.checked ? Math.round(st.score * 100) + "%" : "Chưa kiểm tra");
    const right = h("div", { class: "entbox" }, h("div", { class: "mini" }, "Bài dịch của em ", chip), ta);
    const fb = h("div", { class: "fb", "aria-live": "polite" });
    const acts = h("div", { class: "row", style: "margin-top:8px" });
    const bCheck = h("button", { class: "btn primary", type: "button", onclick: () => {
      if (!ta.value.trim()) { toast("Em hãy dịch thử trước khi kiểm tra nhé."); ta.focus(); return; }
      st.text = ta.value; const r = scoreChunk(c, st.text); st.score = r.s; st.checked = true; st.hit = r.hit; st.miss = r.miss; st.short = r.short; saveTr(); draw(); updScore();
    } }, st.checked ? "Kiểm tra lại" : "Kiểm tra");
    acts.append(bCheck);
    if (!st.revealed) {
      let armed = false;
      const bHint = h("button", { class: "btn warm", type: "button" }, "👁 Xem bản tiếng Anh");
      bHint.addEventListener("click", () => {
        if (!armed) { armed = true; bHint.textContent = "Chắc chưa? Bấm lần nữa: cụm này tính 0 điểm"; setTimeout(() => { armed = false; if (bHint.isConnected) bHint.textContent = "👁 Xem bản tiếng Anh"; }, 5000); return; }
        st.text = ta.value; st.revealed = true; st.checked = true; saveTr(); draw(); updScore(); say([c.en]);
      });
      acts.append(bHint);
    }
    right.append(acts);
    if (st.checked && !st.revealed) {
      fb.className = "fb " + (st.score >= 0.8 ? "good" : "bad");
      fb.textContent = st.score >= 0.8 ? "Tốt! Em đã có các ý chính." : "Chưa đủ ý. " + (st.short ? "Câu dịch còn quá ngắn. " : "");
      right.append(fb);
      if (st.hit && st.hit.length) right.append(h("div", { class: "mini ok" }, "✓ Đã có: " + st.hit.join(", ")));
      if (st.miss && st.miss.length) right.append(h("div", { class: "mini bad" }, "✗ Còn thiếu ý: " + st.miss.join(", ")));
    }
    row.append(left, right);
    if (st.checked || st.revealed) {
      const box = h("div", { class: "analysis" });
      if (st.revealed) box.append(h("div", { class: "revealed" }, h("div", { class: "mini" }, "Bản tiếng Anh:"), h("div", { class: "en", style: "font-size:1.1rem" }, c.en), h("button", { class: "btn", type: "button", style: "margin-top:6px", onclick: () => say([c.en]) }, "🔊 Nghe")));
      box.append(h("div", { class: "tags" }, (c.tag || []).map(t => h("span", { class: "tagpill" }, t))), h("div", null, h("strong", null, "Phân tích cấu trúc: "), c.an));
      row.append(box);
    }
  };
  draw(); return row;
}

/* =====================================================
   4. SUBMIT
   ===================================================== */
function collect() {
  const done = CH.filter(c => trOf(c).checked || trOf(c).revealed).length, rev = CH.filter(c => trOf(c).revealed).length;
  const filled = PLAN_FIELDS.filter(f => wc(PL.f[f.id] || "") >= 3).length;
  const warn = [];
  if (!RES.vocab) warn.push("Em chưa làm bài kiểm tra từ vựng (mục 1).");
  if ((TIME.vocab || 0) < 120) warn.push("Thời gian học từ vựng mới " + fmtT(TIME.vocab || 0) + " (nên học ít nhất 2 phút).");
  if (filled < PLAN_FIELDS.length) warn.push("Dàn ý còn " + (PLAN_FIELDS.length - filled) + " ô chưa viết (mục 2).");
  if (done < CH.length) warn.push("Còn " + (CH.length - done) + "/" + CH.length + " cụm chưa dịch (mục 3).");
  const rows = [];
  rows.push({ part: "Thời gian học", question: "Từ vựng / Dàn ý / Dịch", answer: fmtT(TIME.vocab || 0) + " / " + fmtT(TIME.plan || 0) + " / " + fmtT(TIME.trans || 0), correct: "", result: "" });
  if (RES.vocab) rows.push({ part: "Từ vựng · kiểm tra", question: "Điểm", answer: RES.vocab.score + "/" + RES.vocab.total, correct: "", result: "Sai: " + (RES.vocab.wrong.join(", ") || "-") });
  rows.push({ part: "Dàn ý", question: "Dạng đề em chọn", answer: PL.type === null ? "(chưa chọn)" : TASK_TYPES[PL.type].t, correct: "Thảo luận cả hai quan điểm VÀ nêu ý kiến", result: PL.type !== null && TASK_TYPES[PL.type].ok ? "đúng" : "sai/chưa chọn" });
  PLAN_FIELDS.forEach(f => rows.push({ part: "Dàn ý · " + f.id, question: f.q, answer: PL.f[f.id] || "(trống)", correct: "", result: wc(PL.f[f.id] || "") + " từ" }));
  rows.push({ part: "Dàn ý · thứ tự đoạn", question: "Em chọn", answer: ORDER_ITEMS.map((o, i) => PL.ord[i] || "-").join(" "), correct: ORDER_ITEMS.map(o => o.pos).join(" "), result: ORDER_ITEMS.every((o, i) => +PL.ord[i] === o.pos) ? "đúng" : "sai" });
  CH.forEach((c, i) => { const s = trOf(c); rows.push({ part: "Dịch " + (i + 1), question: c.vi, answer: s.text || "(trống)", correct: c.en, result: s.revealed ? "ĐÃ XEM GỢI Ý · 0%" : s.checked ? Math.round(s.score * 100) + "%" : "chưa làm" }); });
  return { warn, rows, done, rev, filled, p: pct() };
}
let warned = false;
function renderSubmit() {
  const root = $("#panel"); root.replaceChildren();
  const c = collect(), row = (a, b) => h("div", { class: "okrow" }, h("span", null, a), h("strong", null, b));
  root.append(h("div", { class: "panel" }, h("h2", { class: "q", style: "margin-top:0" }, "Kiểm tra trước khi nộp"),
    row("Từ vựng: thời gian học", fmtT(TIME.vocab || 0)),
    row("Kiểm tra từ vựng", RES.vocab ? RES.vocab.score + "/" + RES.vocab.total : "chưa làm"),
    row("Dàn ý", c.filled + "/" + PLAN_FIELDS.length + " ô"),
    row("Điểm dịch song song", c.p + "% (xem gợi ý " + c.rev + " cụm)"),
    row("Số cụm đã làm", c.done + "/" + CH.length)));
  const status = h("div", { class: "fb", "aria-live": "polite" });
  if (c.warn.length && warned) root.append(h("div", { class: "panel", style: "margin-top:14px" }, h("strong", null, "Em còn thiếu:"), h("ul", { class: "warnlist" }, c.warn.map(w => h("li", null, w))), h("p", { class: "mini", style: "margin:0" }, "Em có thể quay lại hoàn thành, hoặc vẫn nộp bài như hiện tại.")));
  const btn = h("button", { class: "btn primary", type: "button", onclick: async () => {
    if (!getName()) { showGate(); return; }
    if (c.warn.length && !warned) { warned = true; renderSubmit(); return; }
    btn.disabled = true; btn.textContent = "Đang nộp…";
    const ign = c.warn.length > 0;
    try {
      await post({ type: "submit", name: getName(), lesson: LESSON, summary: {
        vocab: "Từ vựng " + (RES.vocab ? RES.vocab.score + "/" + RES.vocab.total : "chưa làm") + " · học " + fmtT(TIME.vocab || 0),
        gram: "Dàn ý " + c.filled + "/" + PLAN_FIELDS.length + " ô · học " + fmtT(TIME.plan || 0),
        ctx: "Dịch " + c.p + "% · xem gợi ý " + c.rev + "/" + CH.length + " cụm · học " + fmtT(TIME.trans || 0),
        rec: "-",
        para: "Writing-Family-1" + (ign ? " · CHƯA ĐỦ, đã bỏ qua cảnh báo" : " · đã hoàn thành đủ"),
        feedback: ign ? "Thiếu: " + c.warn.join(" ") : "Đã hoàn thành đủ các phần."
      }, details: c.rows });
      status.className = "fb good"; status.textContent = "Đã nộp bài cho cô. Cảm ơn " + getName() + "!"; warned = false;
      btn.textContent = "Nộp lại"; btn.disabled = false;
    } catch (e) { status.className = "fb bad"; status.textContent = "Chưa nộp được. Hãy kiểm tra mạng rồi bấm nộp lại."; btn.textContent = ign ? "Vẫn nộp bài" : "Nộp bài cho cô"; btn.disabled = false; }
  } }, c.warn.length && warned ? "Vẫn nộp bài" : "Nộp bài cho cô");
  root.append(h("div", { class: "row" }, btn, h("button", { class: "btn", type: "button", onclick: () => { warned = false; renderSubmit(); } }, "Làm mới")), status);
}

/* ---------- shell ---------- */
function renderHeader() {
  const doneMap = { vocab: !!RES.vocab, plan: PLAN_FIELDS.filter(f => wc(PL.f[f.id] || "") >= 3).length === PLAN_FIELDS.length, trans: CH.every(c => trOf(c).checked || trOf(c).revealed), submit: false };
  const box = $("#steps"); box.replaceChildren();
  STEPS.forEach(([id, label]) => box.append(h("button", { class: "stepchip" + (doneMap[id] ? " done" : ""), type: "button", role: "tab", "aria-selected": St.tab === id, onclick: () => go(id) }, (doneMap[id] ? "✅ " : "") + label)));
  const n = ["vocab", "plan", "trans"].filter(k => doneMap[k]).length;
  $("#progText").textContent = "Hoàn thành " + n + "/3 phần";
  $("#progBar").style.width = Math.round(n / 3 * 100) + "%";
}
function render(auto) {
  stopSay(); renderHeader(); showTimer();
  ({ vocab: () => renderVocab(!!auto), plan: renderPlan, trans: renderTrans, submit: renderSubmit })[St.tab]();
  window.scrollTo(0, 0);
}
$("#rename").addEventListener("click", showGate);
$("#gok").addEventListener("click", () => {
  const v = $("#gname").value.trim(); if (!v) { $("#gname").focus(); return; }
  try { localStorage.setItem("wr1_name", v); } catch (e) {}
  $("#gate").hidden = true; updateWho(); toast("Chào " + v + "!");
});
$("#gname").addEventListener("keydown", e => { if (e.key === "Enter") $("#gok").click(); });
if (!hasTTS) $("#banner").append(h("div", { class: "banner" }, "Trình duyệt này chưa hỗ trợ giọng đọc. Hãy mở trang bằng Chrome hoặc Safari."));
updateWho(); if (!getName()) showGate();
render(false);

</script>
