<!DOCTYPE html>

<head>

<style>
/* Layout idea: one narrow column. Header with progress, two modes (cards, dictation), one large card at a time. */
:root {
  --bg: #f3f7f6; --surface: #ffffff; --ink: #14282b; --muted: #566b6e; --line: #d4e1df;
  --accent: #0e7c7b; --accent-ink: #ffffff; --soft: #e1f0ee; --warm: #c8531f;
  --good: #1b7f45; --bad: #b83227; --mark: #fff0c2;
  --font-display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
    --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
  --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.55; font-size: 16px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }

.prog { display: flex; align-items: center; gap: 12px; font-size: .9rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); margin-bottom: 18px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--warm); font-weight: 600; }
button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

.opts { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: .9rem; color: var(--muted); }

.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px 20px; min-height: 260px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; }
.tag { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--warm); font-weight: 600; }
.sent { border-radius: 10px; padding: 6px 10px; margin: 0 -10px; cursor: pointer; transition: background .15s; }
.sent:hover { background: var(--soft); }

.kws { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

.kw b { display: block; font-weight: 600; }

.btn { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer; }

.mini { font-size: .88rem; color: var(--muted); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 20px; }
textarea { width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 120px; }
.ok { color: var(--good); font-weight: 600; }

.diff { margin: 6px 0 12px; line-height: 1.9; }

.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.mask { letter-spacing: .04em; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }

.btn.big{font-size:1.1rem;padding:12px 26px}.btn.fillwarm{background:var(--warm);color:#fff}
mark{background:var(--mark);color:inherit;padding:0 4px;border-radius:4px}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.line{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.recbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.gbox{background:var(--surface);border-radius:16px;padding:24px;max-width:380px;width:100%}

.timebox{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.92rem;font-weight:600;color:var(--accent)}
.pg{font-family:var(--font-display);margin:0 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.vibox{background:var(--soft);border-radius:10px;padding:10px 12px}
.vtxt{font-size:1.02rem;margin-top:4px}
.entbox textarea{min-height:90px}
.analysis{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;font-size:.95rem}
.revealed{background:var(--mark);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tagpill{background:var(--accent);color:var(--accent-ink);font-size:.76rem;padding:2px 9px;border-radius:99px}
.chipst{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin-left:6px}
.chipst.good{background:var(--good);color:#fff;border-color:var(--good)}.chipst.mid{background:var(--mark)}.chipst.rev{background:var(--warm);color:#fff;border-color:var(--warm)}
.stickyscore{position:sticky;top:0;z-index:5;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.scorebig{font-family:var(--font-display);font-size:1.7rem;color:var(--accent)}
select{font:inherit;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.rgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.passage{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:8px;max-height:92vh;overflow:auto}
.kicker{color:var(--warm);font-weight:600;font-size:.85rem}.ptitle{font-family:var(--font-display);margin:2px 0 4px;font-size:1.6rem}.psub{font-weight:600;margin:0 0 8px}
.ppara{margin:0 0 12px;line-height:1.7}.pn{display:inline-block;background:var(--soft);color:var(--accent);font-size:.72rem;font-weight:700;border-radius:99px;padding:0 7px;margin-right:6px}
.hl{border:0;background:none;font:inherit;color:inherit;text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:pointer;padding:0}
.hl:hover{background:var(--mark)}
@media (max-width:820px){.rgrid{grid-template-columns:1fr}.passage{position:static;max-height:none}}
</style>

<div id="gate" hidden><div class="gbox"><div class="bigemo" aria-hidden="true">📰</div><h2 style="font-family:var(--font-display);margin:0 0 6px;text-align:center">Em tên là gì?</h2><p class="mini" style="text-align:center">Cô cần biết tên để nhận bài của em.</p><label for="gname" class="mini">Họ và tên</label><input type="text" id="gname" autocomplete="name"><div class="row"><button class="btn primary" id="gok" type="button">Bắt đầu</button></div></div></div>
<div class="wrap">
<header><div class="top"><div><h1>Reading <span>· Fashion’s favourite</span></h1><p class="sub">Học từ vựng, đọc bài, trả lời câu hỏi, rồi diễn đạt lại bằng lời của em và nộp bài cho cô.</p></div></div>

<script>
/* ===== CONTENT: Reading 1 - "Fashion's favourite" ===== */
const PASSAGE = {
  kicker: "Survey: Fashion", title: "Fashion’s favourite",
  sub: "The high cost of fashion shows is worth every penny to the industry",
  paras: [
    "What is the point of top-end fashion? An haute couture dress can cost more than $100,000. Not surprisingly, there are no more than 2,000 haute couture customers in the world. The commercial point is that haute couture is the fashion house’s loss leader. It creates the image of the brand. Someone who would never pay $20,000 for a hand-made dress might pay $1,000 for an off-the-peg dress with the same designer label—or $50 for its perfumes.",
    "Fashion shows may be expensive, but the publicity they generate works out cheaper and more effective than spending $80,000 a page on advertisements in the glossy fashion magazines. One New York consultancy calculates that a 20-minute show, which could cost up to $500,000, generates as much publicity as $7m of advertising in American fashion magazines. Most people could never wear the clothes, but the idea is to create a buzz.",
    "The true capital of fashion is Paris. It is home to the most famous brands, and it has the biggest number of talented designers. France’s fashion and luxury-goods industry represents some 2,000 firms, 200,000 jobs and 5% of total industrial production. Include the textile industry, with 60,000 employees and the share of industrial activity rises to 8%. With advertising, graphic design and media, it all adds up to real economic weight. And France exports much of this output.",
    "Can Paris continue to be the centre of the fashion industry? Perhaps New York, with its huge domestic market and new creative talent, will become fashion’s centre in the future. But for now, the challenge for everyone is to sell: after all, fashion is a business."
  ]
};

const WORDS = [
  { w: "top-end", ipa: "ˌtɒp ˈend", vi: "cao cấp nhất", ex: "She works for a top-end hotel." },
  { w: "haute couture", ipa: "ˌəʊt kuːˈtjʊə", vi: "thời trang cao cấp may đo", ex: "Haute couture dresses are made by hand." },
  { w: "loss leader", ipa: "ˈlɒs ˌliːdə", vi: "mặt hàng bán lỗ để thu hút khách", ex: "Cheap milk is a loss leader in many shops." },
  { w: "brand", ipa: "brænd", vi: "thương hiệu", ex: "This brand is famous all over the world." },
  { w: "hand-made", ipa: "ˌhænd ˈmeɪd", vi: "làm thủ công", ex: "This is a hand-made bag." },
  { w: "off-the-peg", ipa: "ˌɒf ðə ˈpeɡ", vi: "may sẵn", ex: "An off-the-peg suit is cheaper than a tailor-made one." },
  { w: "label", ipa: "ˈleɪbl", vi: "nhãn hiệu", ex: "I always check the label before I buy clothes." },
  { w: "publicity", ipa: "pʌbˈlɪsəti", vi: "sự quảng bá, sự chú ý của công chúng", ex: "The festival got a lot of publicity." },
  { w: "generate", ipa: "ˈdʒenəreɪt", vi: "tạo ra", ex: "Big events generate a lot of money." },
  { w: "effective", ipa: "ɪˈfektɪv", vi: "hiệu quả", ex: "Social media is an effective way to advertise." },
  { w: "glossy", ipa: "ˈɡlɒsi", vi: "bóng, láng (giấy, tạp chí)", ex: "She reads glossy magazines on Sundays." },
  { w: "consultancy", ipa: "kənˈsʌltənsi", vi: "công ty tư vấn", ex: "A consultancy advised the company on its costs." },
  { w: "calculate", ipa: "ˈkælkjuleɪt", vi: "tính toán", ex: "Let’s calculate the total cost." },
  { w: "buzz", ipa: "bʌz", vi: "sự xôn xao, tiếng vang", ex: "The new shop created a buzz in the city." },
  { w: "luxury goods", ipa: "ˈlʌkʃəri ɡʊdz", vi: "hàng xa xỉ", ex: "Luxury goods are very expensive." },
  { w: "industrial production", ipa: "ɪnˈdʌstriəl prəˈdʌkʃn", vi: "sản xuất công nghiệp", ex: "Industrial production fell last year." },
  { w: "textile", ipa: "ˈtekstaɪl", vi: "ngành dệt, vải vóc", ex: "Many people in Vietnam work in the textile industry." },
  { w: "economic weight", ipa: "ˌiːkəˈnɒmɪk weɪt", vi: "tầm quan trọng về kinh tế", ex: "This industry has real economic weight." },
  { w: "export", ipa: "ɪkˈspɔːt", vi: "xuất khẩu", ex: "Vietnam can export coffee to many countries." },
  { w: "domestic market", ipa: "dəˈmestɪk ˈmɑːkɪt", vi: "thị trường nội địa", ex: "The domestic market is growing fast." }
];

/* Part A: understanding (MCQ). Part B: True/False/Not Given. Part C: short answers (numbers). */
const QA = [
  { q: "What is the main idea of the article?", o: ["Haute couture dresses are too expensive for most people.", "Expensive fashion shows are a good investment for the fashion industry.", "France makes the best clothes in the world.", "New York will soon replace Paris in fashion."], a: 1, x: "Câu phụ đề nói rõ: chi phí cao của các show diễn “worth every penny”. Các đáp án khác chỉ là chi tiết." },
  { q: "In paragraph 1, “It creates the image of the brand” – what does “It” refer to?", o: ["the fashion house", "haute couture", "a perfume", "an off-the-peg dress"], a: 1, x: "Câu trước nói “haute couture is the fashion house’s loss leader”; “It” thay cho haute couture." },
  { q: "Why would someone who never pays $20,000 for a dress buy a $50 perfume from the same brand?", o: ["Perfumes are always better quality than dresses.", "The brand’s image, built by haute couture, makes people want its cheaper products.", "Haute couture customers must also buy perfume.", "Perfumes are given free with a dress."], a: 1, x: "Haute couture tạo hình ảnh thương hiệu, nhờ đó người ta mua hàng rẻ hơn (váy may sẵn, nước hoa) mang cùng nhãn hiệu." },
  { q: "“Works out cheaper” (paragraph 2) is closest in meaning to:", o: ["is more difficult", "turns out to cost less", "is the same price", "is hard to calculate"], a: 1, x: "work out + adj = cuối cùng hóa ra là…; ở đây: hóa ra rẻ hơn." },

      h("div", { class: "okrow" }, h("span", null, "C. Trả lời ngắn"), h("strong", null, r.c[0] + "/" + r.c[1])),
      r.wrong.length ? h("div", null, h("p", { class: "mini" }, "Các câu cần xem lại:"), ...r.wrong.map(w => h("div", { class: "weak" }, w))) : h("p", { class: "ok" }, "Tuyệt vời! Em làm đúng tất cả."),
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => { R.phase = "A"; R.qa = newMcq(); R.tf = newMcq(); R.sh = null; renderRead(); } }, "Làm lại"), h("button", { class: "btn primary", type: "button", onclick: () => go("para") }, "Sang mục 3 →"))));
  }
}
function shortRun(q) {
  if (!R.sh) R.sh = { tries: 0, first: null, vals: SHORT.map(() => ""), ok: SHORT.map(() => false), shown: false };
  const S = R.sh, box = h("div", { class: "panel" });
  SHORT.forEach((s, i) => {
    const inp = h("input", { type: "text", value: S.vals[i], "aria-label": s.q, autocomplete: "off", disabled: S.ok[i] || S.shown ? "" : null });
    inp.addEventListener("input", () => { S.vals[i] = inp.value; });
    box.append(h("div", { class: "line", style: "margin-bottom:8px" }, h("div", null, (i + 1) + ". " + s.q), inp,
      S.ok[i] ? h("div", { class: "ok" }, "✓ " + s.show + ". " + s.x) : S.shown ? h("div", { class: "bad" }, "Đáp án: " + s.show + ". " + s.x) : (S.tries > 0 ? h("div", { class: "bad" }, "Chưa đúng, kiểm tra lại số trong bài nhé.") : null)));
  });
  const done = S.shown || S.ok.every(Boolean);
  box.append(h("div", { class: "row" },
    !done ? h("button", { class: "btn primary", type: "button", onclick: () => {
      S.tries++; SHORT.forEach((s, i) => { if (!S.ok[i]) S.ok[i] = S.vals[i].replace(/\D/g, "") === s.a; });
      if (S.first === null) S.first = S.ok.slice(); renderRead();
    } }, "Kiểm tra") : null,
    !done && S.tries >= 2 ? h("button", { class: "btn warm", type: "button", onclick: () => { S.shown = true; renderRead(); } }, "Xem đáp án") : null,
    done ? h("button", { class: "btn primary", type: "button", onclick: finishRead }, "Xem kết quả") : null));

}
function finishRead() {
  const c = R.sh.first || SHORT.map(() => false);
  const wrong = [...R.qa.wrong.map(it => "A · " + it.q + " → " + it.o[it.a]), ...R.tf.wrong.map(it => "B · " + it.q + " → " + it.o[it.a]), ...SHORT.filter((s, i) => !c[i]).map(s => "C · " + s.q + " → " + s.show)];
  RES.read = { a: [R.qa.score, QA.length], b: [R.tf.score, TFNG.length], c: [c.filter(Boolean).length, SHORT.length], wrong }; saveRes(); R.phase = "done"; renderHeader(); renderRead();
}

/* =====================================================
   3. PARAPHRASE + SUMMARY + OPINION
   ===================================================== */
const PP = store.get("pp", { t: ["", "", "", ""], sc: [null, null, null, null], syn: [false, false, false, false], sum: "", sumChk: null, op: "" });
const savePP = () => store.set("pp", PP);
const toks = s => s.toLowerCase().replace(/[^a-z' -]/g, " ").split(/\s+/).filter(Boolean);
const overlap = (src, t) => { const c = toks(src).filter(w => w.length > 3), set = new Set(toks(t)); return c.length ? c.filter(w => set.has(w)).length / c.length : 0; };
function checkPara(i, text) {
  const p = PARA[i], hit = [], miss = [];
  p.k.forEach(([re, hint]) => (new RegExp(re, "i").test(text) ? hit : miss).push(hint));
  const ov = overlap(p.src, text), n = wc(text), need = Math.max(5, Math.round(p.src.split(/\s+/).length * 0.5));
  let s = hit.length / p.k.length * Math.min(1, n / need); if (ov > 0.7) s *= 0.5;
  return { score: Math.round(s * 100) / 100, hit, miss, ov: Math.round(ov * 100), copied: ov > 0.7, short: n < need };
}
const ppPct = () => Math.round(PP.sc.reduce((a, s) => a + (s ? s.score : 0), 0) / PARA.length * 100);
let ppScoreEl = null;
function updPP() { if (!ppScoreEl) return; ppScoreEl.replaceChildren(h("span", { class: "scorebig" }, ppPct() + "%"), h("span", { class: "mini" }, " Điểm diễn đạt lại · đã chấm " + PP.sc.filter(Boolean).length + "/" + PARA.length + " câu")); }
function renderPara() {
  const root = $("#panel"); root.replaceChildren();
  root.append(h("div", { class: "scn" }, h("strong", null, "Bước 3: Viết lại bằng lời của em. "), "Với mỗi câu trong bài, em viết lại bằng tiếng Anh, giữ nguyên ý nhưng ", h("strong", null, "đổi từ và cấu trúc"), ". Máy kiểm tra các ý chính và cảnh báo nếu em chép lại quá nhiều từ gốc.", h("div", { class: "vi" }, "Đây là kỹ năng paraphrase, rất quan trọng cho Writing và Speaking.")));
  ppScoreEl = h("div", { class: "stickyscore", "aria-live": "polite" }); root.append(ppScoreEl);
  PARA.forEach((p, i) => {
    const row = h("div", { class: "pair" });
    const draw = () => {
      row.replaceChildren();
      const ta = h("textarea", { rows: "3", placeholder: "Viết lại bằng tiếng Anh…", "aria-label": "Viết lại câu " + (i + 1) }); ta.value = PP.t[i];
      ta.addEventListener("input", () => { PP.t[i] = ta.value; savePP(); });
      const s = PP.sc[i];
      const chip = h("span", { class: "chipst" + (s ? (s.score >= 0.8 ? " good" : " mid") : "") }, s ? Math.round(s.score * 100) + "%" : "Chưa chấm");
      row.append(h("div", { class: "vibox" }, h("div", { class: "mini" }, "Câu gốc " + (i + 1)), h("div", { class: "vtxt" }, p.src), h("button", { class: "btn", type: "button", style: "margin-top:6px", onclick: () => say([p.src]) }, "🔊")),
        h("div", { class: "entbox" }, h("div", { class: "mini" }, "Câu của em ", chip), ta,
          h("div", { class: "row", style: "margin-top:8px" }, h("button", { class: "btn primary", type: "button", onclick: () => { if (!ta.value.trim()) { toast("Em hãy viết thử trước khi kiểm tra nhé."); ta.focus(); return; } PP.t[i] = ta.value; PP.sc[i] = checkPara(i, ta.value); savePP(); draw(); updPP(); } }, s ? "Kiểm tra lại" : "Kiểm tra"),
            h("button", { class: "btn warm", type: "button", onclick: () => { PP.syn[i] = !PP.syn[i]; savePP(); draw(); } }, PP.syn[i] ? "Ẩn gợi ý" : "💡 Từ đồng nghĩa gợi ý"))));
      if (PP.syn[i]) row.append(h("div", { class: "analysis" }, h("strong", null, "Gợi ý (xem sẽ được ghi nhận): "), p.syn));
      if (s) row.append(h("div", { class: "analysis" },
        s.copied ? h("div", { class: "bad" }, "⚠ Em chép lại khoảng " + s.ov + "% từ gốc. Hãy đổi từ đồng nghĩa và cách diễn đạt.") : h("div", { class: "mini" }, "Mức trùng từ gốc: " + s.ov + "% (càng thấp càng tốt)."),
        s.short ? h("div", { class: "bad" }, "Câu của em còn hơi ngắn.") : null,
        s.hit.length ? h("div", { class: "ok" }, "✓ Đã có ý: " + s.hit.join("; ")) : null,
        s.miss.length ? h("div", { class: "bad" }, "✗ Còn thiếu ý: " + s.miss.join("; ")) : null,
        h("details", null, h("summary", null, "Xem câu mẫu của cô"), h("p", null, p.model), h("button", { class: "btn", type: "button", onclick: () => say([p.model]) }, "🔊 Nghe"))));
    };
    draw(); root.append(row);
  });
  updPP();
  // summary
  root.append(h("h3", { class: "sec" }, "Tóm tắt bài đọc (3–4 câu, tiếng Anh hoặc tiếng Việt)"));
  const sa = h("textarea", { rows: "5", placeholder: "Tóm tắt các ý chính của cả bài…", "aria-label": "Tóm tắt" }); sa.value = PP.sum;
  const sfb = h("div", { "aria-live": "polite" });

  sa.addEventListener("input", () => { PP.sum = sa.value; savePP(); });
  root.append(h("div", { class: "line" }, sa, h("div", { class: "row", style: "margin-top:0" }, h("button", { class: "btn primary", type: "button", onclick: () => { const t = sa.value.toLowerCase(), ok = SUMMARY_K.filter(([re]) => new RegExp(re, "i").test(t)).map(x => x[1]); PP.sumChk = { ok, pass: ok.length >= 4 && wc(sa.value) >= 30, words: wc(sa.value) }; savePP(); showSum(); } }, "Kiểm tra tóm tắt")), sfb)); showSum();

  const ocnt = h("span", { class: "mini" }, wc(oa.value) + " từ");

  root.append(h("div", { class: "row spread" }, h("span", { class: "mini" }, "Bài của em được tự lưu trên máy này."), h("button", { class: "btn primary", type: "button", onclick: () => go("submit") }, "Sang mục 4 →")));
}

/* =====================================================
   4. SUBMIT
   ===================================================== */
function collect() {
  const checked = PP.sc.filter(Boolean).length, warn = [];
  if (!RES.vocab) warn.push("Em chưa làm bài kiểm tra từ vựng (mục 1).");
  if ((TIME.vocab || 0) < 120) warn.push("Thời gian học từ vựng mới " + fmtT(TIME.vocab || 0) + " (nên học ít nhất 2 phút).");
  if (!RES.read) warn.push("Em chưa làm xong phần đọc hiểu (mục 2).");
  if (checked < PARA.length) warn.push("Còn " + (PARA.length - checked) + " câu diễn đạt lại chưa kiểm tra (mục 3).");
  if (wc(PP.sum) < 15) warn.push("Em chưa viết tóm tắt (mục 3).");
  const rows = [{ part: "Thời gian học", question: "Từ vựng / Đọc / Diễn đạt lại", answer: fmtT(TIME.vocab || 0) + " / " + fmtT(TIME.read || 0) + " / " + fmtT(TIME.para || 0), correct: "", result: "" }];
  if (RES.vocab) rows.push({ part: "Từ vựng · kiểm tra", question: "Điểm", answer: RES.vocab.score + "/" + RES.vocab.total, correct: "", result: "Sai: " + (RES.vocab.wrong.join(", ") || "-") });
  if (RES.read) { rows.push({ part: "Đọc hiểu · điểm", question: "A / B / C", answer: RES.read.a.join("/") + " · " + RES.read.b.join("/") + " · " + RES.read.c.join("/"), correct: "", result: "" }); RES.read.wrong.forEach((w, i) => rows.push({ part: "Đọc hiểu · câu sai " + (i + 1), question: w, answer: "", correct: "", result: "sai lần đầu" })); }
  PARA.forEach((p, i) => { const s = PP.sc[i]; rows.push({ part: "Diễn đạt lại " + (i + 1), question: p.src, answer: PP.t[i] || "(trống)", correct: p.model, result: s ? Math.round(s.score * 100) + "% · trùng từ gốc " + s.ov + "%" + (s.miss.length ? " · thiếu: " + s.miss.join("; ") : "") + (PP.syn[i] ? " · đã xem gợi ý" : "") : "chưa chấm" }); });
  rows.push({ part: "Tóm tắt", question: "Tóm tắt cả bài", answer: PP.sum || "(trống)", correct: "", result: PP.sumChk ? PP.sumChk.ok.length + "/6 ý · " + PP.sumChk.words + " từ" : "chưa kiểm tra" });
  rows.push({ part: "Ý kiến", question: "Expensive fashion shows: worth it?", answer: PP.op || "(trống)", correct: "", result: wc(PP.op) + " từ" });

}
let warned = false;
function renderSubmit() {
  const root = $("#panel"); root.replaceChildren();
  const c = collect(), row = (a, b) => h("div", { class: "okrow" }, h("span", null, a), h("strong", null, b)), r = RES.read;
  root.append(h("div", { class: "panel" }, h("h2", { class: "q", style: "margin-top:0" }, "Kiểm tra trước khi nộp"),
    row("Từ vựng: thời gian học", fmtT(TIME.vocab || 0)), row("Kiểm tra từ vựng", RES.vocab ? RES.vocab.score + "/" + RES.vocab.total : "chưa làm"),
    row("Đọc hiểu (A · B · C)", r ? r.a.join("/") + " · " + r.b.join("/") + " · " + r.c.join("/") : "chưa làm"),
    row("Diễn đạt lại", ppPct() + "% (" + c.checked + "/" + PARA.length + " câu)"), row("Tóm tắt", wc(PP.sum) + " từ")));
  const status = h("div", { class: "fb", "aria-live": "polite" });
  if (c.warn.length && warned) root.append(h("div", { class: "panel", style: "margin-top:14px" }, h("strong", null, "Em còn thiếu:"), h("ul", { class: "warnlist" }, c.warn.map(w => h("li", null, w))), h("p", { class: "mini", style: "margin:0" }, "Em có thể quay lại hoàn thành, hoặc vẫn nộp bài như hiện tại.")));
  const btn = h("button", { class: "btn primary", type: "button", onclick: async () => {
    if (!getName()) { showGate(); return; }
    if (c.warn.length && !warned) { warned = true; renderSubmit(); return; }
    btn.disabled = true; btn.textContent = "Đang nộp…"; const ign = c.warn.length > 0;
    try {
      await post({ type: "submit", name: getName(), lesson: LESSON, summary: {
        vocab: "Từ vựng " + (RES.vocab ? RES.vocab.score + "/" + RES.vocab.total : "chưa làm") + " · học " + fmtT(TIME.vocab || 0),
        gram: "Đọc hiểu " + (r ? "A " + r.a.join("/") + " · B " + r.b.join("/") + " · C " + r.c.join("/") : "chưa làm") + " · học " + fmtT(TIME.read || 0),
        ctx: "Diễn đạt lại " + ppPct() + "% · " + c.checked + "/" + PARA.length + " câu · học " + fmtT(TIME.para || 0),
        rec: "-", para: "Reading-Fashion-1" + (ign ? " · CHƯA ĐỦ, đã bỏ qua cảnh báo" : " · đã hoàn thành đủ"),
        feedback: ign ? "Thiếu: " + c.warn.join(" ") : "Đã hoàn thành đủ các phần." }, details: c.rows });
      status.className = "fb good"; status.textContent = "Đã nộp bài cho cô. Cảm ơn " + getName() + "!"; warned = false; btn.textContent = "Nộp lại"; btn.disabled = false;
    } catch (e) { status.className = "fb bad"; status.textContent = "Chưa nộp được. Hãy kiểm tra mạng rồi bấm nộp lại."; btn.textContent = ign ? "Vẫn nộp bài" : "Nộp bài cho cô"; btn.disabled = false; }
  } }, c.warn.length && warned ? "Vẫn nộp bài" : "Nộp bài cho cô");
  root.append(h("div", { class: "row" }, btn, h("button", { class: "btn", type: "button", onclick: () => { warned = false; renderSubmit(); } }, "Làm mới")), status);
}

/* ---------- shell ---------- */
function renderHeader() {
  const doneMap = { vocab: !!RES.vocab, read: !!RES.read, para: PP.sc.every(Boolean) && wc(PP.sum) >= 15, submit: false };
  const box = $("#steps"); box.replaceChildren();
  STEPS.forEach(([id, label]) => box.append(h("button", { class: "stepchip" + (doneMap[id] ? " done" : ""), type: "button", role: "tab", "aria-selected": St.tab === id, onclick: () => go(id) }, (doneMap[id] ? "✅ " : "") + label)));
  const n = ["vocab", "read", "para"].filter(k => doneMap[k]).length;
  $("#progText").textContent = "Hoàn thành " + n + "/3 phần"; $("#progBar").style.width = Math.round(n / 3 * 100) + "%";
}
function render(auto) { stopSay(); renderHeader(); showTimer(); ({ vocab: () => renderVocab(!!auto), read: renderRead, para: renderPara, submit: renderSubmit })[St.tab](); window.scrollTo(0, 0); }
$("#rename").addEventListener("click", showGate);
$("#gok").addEventListener("click", () => { const v = $("#gname").value.trim(); if (!v) { $("#gname").focus(); return; } try { localStorage.setItem("rd1_name", v); } catch (e) {} $("#gate").hidden = true; updateWho(); toast("Chào " + v + "!"); });
$("#gname").addEventListener("keydown", e => { if (e.key === "Enter") $("#gok").click(); });
if (!hasTTS) $("#banner").append(h("div", { class: "banner" }, "Trình duyệt này chưa hỗ trợ giọng đọc. Hãy mở trang bằng Chrome hoặc Safari."));
updateWho(); if (!getName()) showGate();
