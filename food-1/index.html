<style>
/* Layout idea: one narrow column. Header with progress, two modes (cards, dictation), one large card at a time. */

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
    --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
    color-scheme: dark;
  }
}

  --bg: #0f1b1d; --surface: #172a2d; --ink: #e6f1ef; --muted: #9bb2b4; --line: #27403f;
  --accent: #4cc3bd; --accent-ink: #06201f; --soft: #1d3a3b; --warm: #f0925f; --good: #5dd28c; --bad: #ff8a7a; --mark: #4a3d12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.55; font-size: 16px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }

.sub { color: var(--muted); margin: 6px 0 0; max-width: 56ch; }

a.link:hover { background: var(--soft); }

.bar { flex: 1; height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--warm); font-weight: 600; }
button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

.tag { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--warm); font-weight: 600; }
.sent { border-radius: 10px; padding: 6px 10px; margin: 0 -10px; cursor: pointer; transition: background .15s; }
.sent:hover { background: var(--soft); }

.ipa { color: var(--accent); font-size: .95rem; margin-top: 2px; word-break: break-word; }
.vi { color: var(--ink); font-size: 1.05rem; }
.small-en { color: var(--muted); font-size: .9rem; }
.kws { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.kw { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.kw b { display: block; font-weight: 600; }
.kw span { display: block; font-size: .82rem; color: var(--muted); }
.kw .p { color: var(--accent); }
.hint { color: var(--muted); font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.row.spread { justify-content: space-between; }
.btn { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.warm { border-color: var(--warm); color: var(--warm); }
.btn:disabled { opacity: .45; cursor: default; }
.mini { font-size: .88rem; color: var(--muted); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 20px; }
textarea { width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 120px; }
.ok { color: var(--good); font-weight: 600; }

.extra { color: var(--bad); text-decoration: line-through; }
.diff { margin: 6px 0 12px; line-height: 1.9; }
.diff { overflow-wrap: anywhere; }
.score { font-family: var(--font-display); font-size: 1.6rem; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.mask { letter-spacing: .04em; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
.banner { background: var(--mark); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .92rem; }
.weak { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }

.who{font-size:.88rem;color:var(--muted)}
.who button{border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0 0 0 4px}

.two{display:flex;gap:6px;width:100%;margin-top:4px}

.opts2{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:left;padding:11px 14px;border-radius:10px;cursor:pointer}
.opt:disabled{cursor:default}.opt.good{border-color:var(--good);background:var(--soft);font-weight:600}.opt.badopt{border-color:var(--bad)}
.fb{margin-top:10px;min-height:1.2em}.fb.good{color:var(--good);font-weight:600}.fb.bad{color:var(--bad);font-weight:600}
.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin:10px 0}
.word{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:7px 12px;border-radius:10px;cursor:pointer}
.word:disabled{opacity:.3}
.btn.big{font-size:1.1rem;padding:12px 26px}.btn.fillwarm{background:var(--warm);color:#fff}
mark{background:var(--mark);color:inherit;padding:0 4px;border-radius:4px}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.line{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.recbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recbox audio{max-width:100%;height:36px}
.theory{margin:0 0 10px;padding-left:20px}.theory li{margin-bottom:6px}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
.okrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.warnlist{margin:8px 0;padding-left:20px;color:var(--bad)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#gate[hidden]{display:none}
.gbox{background:var(--surface);border-radius:16px;padding:24px;max-width:380px;width:100%}
</style>
</head>
<body>
<div id="gate" hidden><div class="gbox"><div class="bigemo" aria-hidden="true">🍎</div><h2 style="font-family:var(--font-display);margin:0 0 6px;text-align:center">Em tên là gì?</h2><p class="mini" style="text-align:center">Cô cần biết tên để nhận bài của em.</p><label for="gname" class="mini">Họ và tên</label><input type="text" id="gname" autocomplete="name"><div class="row"><button class="btn primary" id="gok" type="button">Bắt đầu</button></div></div></div>
<div class="wrap">
<header><div class="top"><div><h1>Food <span>· Meat, Fish, Fruit &amp; Vegetables</span></h1><p class="sub">I can name meat and fish. I can name fruit and vegetables. Tự học theo 5 bước, cuối cùng nộp bài cho cô.</p></div></div>

</div>

<script>
/* ===== CONTENT: Food (A2) ===== */

    { w: "duck", ipa: "dʌk", vi: "thịt vịt", e: "🦆", ex: "Do you eat duck?" },
    { w: "ham", ipa: "hæm", vi: "giăm bông", e: "🍖", ex: "I like ham in my sandwich." },

  ]},
  { id: "fish", title: "Cá và hải sản (Fish & seafood)", words: [
    { w: "salmon", ipa: "ˈsæmən", vi: "cá hồi", e: "🐟", ex: "Salmon is a fish." },
    { w: "tuna", ipa: "ˈtuːnə", vi: "cá ngừ", e: "", ex: "I like tuna in my salad." },
    { w: "squid", ipa: "skwɪd", vi: "mực", e: "🦑", ex: "Squid is seafood." },
    { w: "prawns", ipa: "prɔːnz", vi: "tôm", e: "🦐", ex: "Prawns are small seafood." },
    { w: "crab", ipa: "kræb", vi: "cua", e: "🦀", ex: "I don't eat crab." },
    { w: "mussels", ipa: "ˈmʌslz", vi: "trai, vẹm", e: "", ex: "Mussels are seafood." }

  { id: "fruit", title: "Trái cây (Fruit)", words: [

    { w: "pear", ipa: "pɛr", vi: "lê", e: "🍐", ex: "This pear is very sweet." },
    { w: "lemon", ipa: "ˈlɛmən", vi: "chanh vàng", e: "🍋", ex: "Lemons are very bitter." },

    { w: "strawberry", ipa: "ˈstrɔːbɛri", vi: "dâu tây", e: "🍓", ex: "Strawberries are very sweet." },
    { w: "cherry", ipa: "ˈtʃɛri", vi: "anh đào", e: "🍒", ex: "Cherries are small and red." },
    { w: "melon", ipa: "ˈmɛlən", vi: "dưa lê, dưa vàng", e: "🍈", ex: "Do you like melon?" },
    { w: "grapes", ipa: "ɡreɪps", vi: "nho", e: "🍇", ex: "Grapes are small and sweet." },
    { w: "pineapple", ipa: "ˈpaɪnæpl", vi: "quả dứa (thơm)", e: "🍍", ex: "Pineapple is sweet and fresh." },
    { w: "avocado", ipa: "ˌævəˈkɑːdoʊ", vi: "quả bơ", e: "🥑", ex: "I like avocado on bread." }
  ]},
  { id: "veg", title: "Rau củ (Vegetables)", words: [
    { w: "potato", ipa: "pəˈteɪtoʊ", vi: "khoai tây", e: "🥔", ex: "I eat a potato with my dinner." },
    { w: "beans", ipa: "biːnz", vi: "đậu que", e: "🫘", ex: "Green beans are vegetables." },
    { w: "onion", ipa: "ˈʌnjən", vi: "hành tây", e: "🧅", ex: "I put onion in the soup." },

    { w: "cauliflower", ipa: "ˈkɔːlɪflaʊər", vi: "súp lơ trắng", e: "", ex: "Cauliflower is white." },
    { w: "cabbage", ipa: "ˈkæbɪdʒ", vi: "bắp cải", e: "", ex: "Cabbage is green." },

// True / False. For false statements: wrong = part to correct, fix = accepted answers, full = correct sentence.
const TFS = [
  { t: "Beef comes from a cow.", ok: true, vi: "Thịt bò đến từ con bò." },
  { t: "Pork comes from a sheep.", ok: false, wrong: "sheep", fix: ["pig"], full: "Pork comes from a pig.", vi: "Thịt lợn đến từ con lợn." },
  { t: "Lamb comes from a sheep.", ok: true, vi: "Thịt cừu đến từ con cừu." },
  { t: "Tuna is a fish.", ok: true, vi: "Cá ngừ là một loại cá." },
  { t: "Squid is a fish.", ok: false, wrong: "a fish", fix: ["seafood"], full: "Squid is seafood.", vi: "Mực là hải sản." },

  { t: "Bacon comes from a chicken.", ok: false, wrong: "chicken", fix: ["pig"], full: "Bacon comes from a pig.", vi: "Thịt xông khói đến từ con lợn." },
  { t: "Ham and sausages come from a pig.", ok: true, vi: "Giăm bông và xúc xích đến từ con lợn." },
  { t: "A banana is a vegetable.", ok: false, wrong: "vegetable", fix: ["fruit"], full: "A banana is a fruit.", vi: "Chuối là một loại trái cây." },
  { t: "A carrot is a fruit.", ok: false, wrong: "fruit", fix: ["vegetable"], full: "A carrot is a vegetable.", vi: "Cà rốt là một loại rau củ." },
  { t: "Strawberries are very sweet.", ok: true, vi: "Dâu tây rất ngọt." },

  const rows = [
    { part: "Từ vựng · tự đánh giá", question: "Biết / Chưa biết", answer: know + " / " + unk, correct: "", result: "" },
    { part: "Từ vựng · từ chưa biết", question: "Danh sách (sau kiểm tra)", answer: unknownWords().map(w => w.w).join(", "), correct: "", result: "" }
  ];
  if (v) rows.push({ part: "Từ vựng · kiểm tra", question: "Điểm", answer: v.score + "/" + v.total, correct: "", result: "Sai: " + (v.wrong.join(", ") || "-") + " | Tưởng là biết: " + (v.falseKnown.join(", ") || "-") });
  if (tf) tf.items.forEach((it, i) => rows.push({ part: "Đúng/Sai " + (i + 1), question: it.t, answer: "Chọn " + it.judge + (it.ok ? "" : "; sửa: " + (it.fix || "(chưa)")), correct: it.ok ? "True" : "False → " + it.full, result: (it.judgeOk ? "chọn đúng" : "chọn sai") + (it.ok ? "" : it.fixOk ? "; sửa đúng ngay" : "; sửa chưa đúng ngay") }));
  if (gr) { rows.push({ part: "Ngữ pháp · chọn đáp án", question: "Điểm", answer: gr.m[0] + "/" + gr.m[1], correct: "", result: gr.wrong.join(" | ") || "-" }); rows.push({ part: "Ngữ pháp · sắp xếp câu", question: "Điểm lần đầu", answer: gr.b[0] + "/" + gr.b[1], correct: "", result: "" }); }
  recKeys.forEach(k => { const r = REC[k]; rows.push({ part: "Speaking " + k.replace("sp|", ""), question: r.target, answer: r.sent ? "đã gửi" : "CHƯA gửi", correct: "", result: (r.score != null ? "Phát âm ~" + r.score + "% · " : "") + (r.transcript || "") }); });
  return { warn, rows, know, unk, v, tf, gr, recKeys, sent };
}
let warned = false;
function renderSubmit() {
  const root = $("#panel"); root.replaceChildren();
  const c = collect();
  const row = (a, b) => h("div", { class: "okrow" }, h("span", null, a), h("strong", null, b));
  root.append(h("div", { class: "panel" },
    h("h2", { class: "q", style: "margin-top:0" }, "Kiểm tra trước khi nộp"),
    row("Từ vựng: biết / chưa biết", c.know + " / " + c.unk),
    row("Kiểm tra từ vựng", c.v ? c.v.score + "/" + c.v.total : "chưa làm"),
    row("Đúng hay sai", c.tf ? "chọn " + c.tf.judge[0] + "/" + c.tf.judge[1] + " · sửa " + c.tf.fix[0] + "/" + c.tf.fix[1] : "chưa làm"),
    row("Ngữ pháp", c.gr ? "chọn " + c.gr.m[0] + "/" + c.gr.m[1] + " · sắp xếp " + c.gr.b[0] + "/" + c.gr.b[1] : "chưa làm"),
    row("Speaking đã gửi", c.sent + "/" + c.recKeys.length + " bản")));
  const status = h("div", { class: "fb", "aria-live": "polite" });
  if (c.warn.length && warned) root.append(h("div", { class: "panel", style: "margin-top:14px" }, h("strong", null, "Em còn thiếu:"), h("ul", { class: "warnlist" }, c.warn.map(w => h("li", null, w))), h("p", { class: "mini", style: "margin:0" }, "Em có thể quay lại hoàn thành, hoặc vẫn nộp bài như hiện tại.")));
  const go = h("button", { class: "btn primary", type: "button", onclick: async () => {
    if (!getName()) { showGate(); return; }
    if (c.warn.length && !warned) { warned = true; renderSubmit(); return; }
    go.disabled = true; go.textContent = "Đang nộp…";
    const ignored = c.warn.length > 0;
    try {
      await post({ type: "submit", name: getName(), lesson: LESSON, summary: {
        vocab: "Biết " + c.know + "/" + ALL.length + " · Kiểm tra " + (c.v ? c.v.score + "/" + c.v.total : "chưa làm"),
        gram: "Ngữ pháp " + (c.gr ? c.gr.m[0] + "/" + c.gr.m[1] + " · sắp xếp " + c.gr.b[0] + "/" + c.gr.b[1] : "chưa làm"),
        ctx: "Đúng/Sai " + (c.tf ? c.tf.judge[0] + "/" + c.tf.judge[1] + " · sửa " + c.tf.fix[0] + "/" + c.tf.fix[1] : "chưa làm"),
        rec: c.sent + "/" + c.recKeys.length + " bản ghi",
        para: "Food-1" + (ignored ? " · CHƯA ĐỦ, đã bỏ qua cảnh báo" : " · đã hoàn thành đủ"),
        feedback: ignored ? "Thiếu: " + c.warn.join(" ") : "Đã hoàn thành đủ các phần."
      }, details: c.rows });
      status.className = "fb good"; status.textContent = "Đã nộp bài cho cô. Cảm ơn " + getName() + "!"; warned = false;
      go.textContent = "Nộp lại"; go.disabled = false;
    } catch (e) { status.className = "fb bad"; status.textContent = "Chưa nộp được. Hãy kiểm tra mạng rồi bấm nộp lại."; go.textContent = c.warn.length ? "Vẫn nộp bài" : "Nộp bài cho cô"; go.disabled = false; }
  } }, c.warn.length && warned ? "Vẫn nộp bài" : "Nộp bài cho cô");
  root.append(h("div", { class: "row" }, go, h("button", { class: "btn", type: "button", onclick: () => { warned = false; renderSubmit(); } }, "Làm mới")), status);
}

/* ---------- shell ---------- */
function renderHeader() {
  const doneMap = { vocab: !!RES.vocab, tf: !!RES.tf, gram: !!RES.gram, speak: !!RES.speak, submit: false };
  const box = $("#steps"); box.replaceChildren();
  STEPS.forEach(([id, label]) => box.append(h("button", { class: "stepchip" + (doneMap[id] ? " done" : ""), type: "button", role: "tab", "aria-selected": St.tab === id, onclick: () => { St.tab = id; render(); } }, (doneMap[id] ? "✅ " : "") + label)));
  const n = ["vocab", "tf", "gram", "speak"].filter(k => doneMap[k]).length;
  $("#progText").textContent = "Hoàn thành " + n + "/4 phần";
  $("#progBar").style.width = Math.round(n / 4 * 100) + "%";
}
function render(auto) {
  stopSay(); renderHeader();
  ({ vocab: () => renderVocab(!!auto), tf: renderTF, gram: renderGram, speak: renderSpeak, submit: renderSubmit })[St.tab]();
}
$("#rename").addEventListener("click", showGate);
$("#gok").addEventListener("click", () => {
  const v = $("#gname").value.trim();
  if (!v) { $("#gname").focus(); return; }
  try { localStorage.setItem("food1_name", v); } catch (e) {}
  $("#gate").hidden = true; updateWho(); toast("Chào " + v + "!");
});
$("#gname").addEventListener("keydown", e => { if (e.key === "Enter") $("#gok").click(); });
if (!hasTTS) $("#banner").append(h("div", { class: "banner" }, "Trình duyệt này chưa hỗ trợ giọng đọc. Hãy mở trang bằng Chrome hoặc Safari."));
updateWho();
if (!getName()) showGate();
render(false);

</script>
